<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f5a2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meeple Meadows">
<script>if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });</script>
<title>Meeple Meadows</title>
<style>
:root{
  --ink:#3d2a1f; --ink2:#6a4a32; --paper:#fbf3df; --paper2:#f4e4bc; --paper3:#ead6a6;
  --wood:#8a5a32; --wood2:#b07a42; --green:#5aa335; --green2:#3f7f25; --red:#d8463a; --gold:#f2c23a;
  --blue:#4f7fb8; --shadow:rgba(40,25,10,.35);
  --font:"Nunito","Varela Round","Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
}
html{font-size:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#284a2a;font-family:var(--font);color:var(--ink);touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;top:0;right:0;bottom:0;left:0;display:block;touch-action:none}
.ico{width:1.6rem;height:1.6rem;vertical-align:middle;object-fit:contain;pointer-events:none}
.ico.sm{width:1.2rem;height:1.2rem}.ico.lg{width:2.4rem;height:2.4rem}.ico.xl{width:3.4rem;height:3.4rem}
.hidden{display:none!important}

/* ---------- buttons */
.btn{font:inherit;font-weight:800;color:var(--ink);border:2px solid var(--ink);border-radius:.8rem;padding:.45rem .9rem;
  background:linear-gradient(#fffaf0,#f1dfb4);box-shadow:0 .22rem 0 var(--ink),0 .35rem .6rem var(--shadow);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;font-size:.95rem;line-height:1.1;position:relative;top:0;transition:top .05s,box-shadow .05s}
.btn:active{top:.18rem;box-shadow:0 .04rem 0 var(--ink),0 .1rem .3rem var(--shadow)}
.btn.green{background:linear-gradient(#8fd06a,#4f9a30);color:#fff;text-shadow:0 1px 0 #2a5a18}
.btn.red{background:linear-gradient(#f08070,#c8382a);color:#fff;text-shadow:0 1px 0 #6a1a10}
.btn.gold{background:linear-gradient(#ffe48a,#e8aa2a)}
.btn.blue{background:linear-gradient(#9ac4f0,#4f7fb8);color:#fff;text-shadow:0 1px 0 #1a3a6a}
.btn.sm{padding:.28rem .55rem;font-size:.8rem;border-radius:.6rem}
.btn.on{background:linear-gradient(#8fd06a,#4f9a30);color:#fff}
.btn[disabled],.btn.dis{filter:grayscale(.7) brightness(.92);opacity:.6;pointer-events:none}
.btn.wide{width:100%}

/* ---------- title */
#title{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;
  background:radial-gradient(ellipse at center,rgba(255,240,200,.0) 30%,rgba(30,20,10,.45) 100%)}
.logo{text-align:center;margin-bottom:1.6rem;animation:float 4s ease-in-out infinite}
.logo h1{margin:0;font-size:clamp(2.6rem,8vw,5.2rem);font-weight:900;letter-spacing:.02em;color:#fff6dc;line-height:.95;
  -webkit-text-stroke:.12em var(--ink);paint-order:stroke fill;text-shadow:0 .08em 0 var(--ink),0 .18em .4em rgba(0,0,0,.4)}
.logo h1 span{color:#ffd06a}
.logo .sub{display:inline-block;margin-top:.7rem;background:var(--paper);border:2px solid var(--ink);border-radius:2rem;padding:.25rem 1rem;font-weight:800;color:var(--ink2);box-shadow:0 .2rem 0 var(--ink)}
.logo .meeples{display:flex;justify-content:center;gap:.3rem;margin-bottom:.4rem}
.logo .meeples img{width:2.6rem;height:2.6rem;animation:hop 1.2s ease-in-out infinite}
.logo .meeples img:nth-child(2){animation-delay:.15s}.logo .meeples img:nth-child(3){animation-delay:.3s}.logo .meeples img:nth-child(4){animation-delay:.45s}.logo .meeples img:nth-child(5){animation-delay:.6s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-.6rem)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-.4rem) rotate(1deg)}}
.menu{display:flex;flex-direction:column;gap:.8rem;min-width:16rem}
.menu .btn{font-size:1.15rem;padding:.7rem 1.2rem}
.ver{position:fixed;bottom:.5rem;right:.8rem;color:#fff6dc;opacity:.7;font-size:.75rem;font-weight:700;z-index:31}

/* ---------- hud */
#hud{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
.topbar{position:absolute;top:calc(.5rem + env(safe-area-inset-top));left:calc(.5rem + env(safe-area-inset-left));right:calc(.5rem + env(safe-area-inset-right));display:flex;gap:.5rem;align-items:flex-start;pointer-events:none}
.topbar > *{pointer-events:auto}
.pill{display:flex;align-items:center;gap:.35rem;background:var(--paper);border:2px solid var(--ink);border-radius:2rem;padding:.2rem .7rem .2rem .25rem;
  font-weight:900;font-size:1.05rem;box-shadow:0 .2rem 0 var(--ink),0 .3rem .6rem var(--shadow);white-space:nowrap}
.pill .ico{width:1.8rem;height:1.8rem}
.pill.coins{min-width:7.5rem}
.goal{flex:1;max-width:30rem;margin:0 auto;background:var(--paper);border:2px solid var(--ink);border-radius:1rem;padding:.3rem .6rem;box-shadow:0 .2rem 0 var(--ink),0 .3rem .6rem var(--shadow);cursor:pointer}
.goal .gt{display:flex;align-items:center;gap:.4rem;font-weight:900;font-size:.9rem}
.goal .gt .ico{width:1.5rem;height:1.5rem}
.goal .reqs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.15rem}
/* with a panel open the goal keeps to one line, so the two never overlap */
.panel-open .goal .reqs{display:none}
.req{display:flex;align-items:center;gap:.2rem;font-size:.75rem;font-weight:800;flex:1;min-width:5.5rem}
.req .ico{width:1.1rem;height:1.1rem}
.bar{height:.5rem;background:#d8c49a;border:1.5px solid var(--ink);border-radius:1rem;overflow:hidden;flex:1}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(#9ad870,#4f9a30);border-radius:1rem;transition:width .3s}
.bar.gold > i{background:linear-gradient(#ffe48a,#e8aa2a)}
.bar.big{height:.8rem}
.iconbtn{width:3rem;height:3rem;border-radius:1rem;padding:0}
.iconbtn .ico{width:2rem;height:2rem}
.toolbar{position:absolute;bottom:calc(.6rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:.45rem;padding:.4rem .5rem;
  background:linear-gradient(#a8743e,#7a4f2a);border:2px solid var(--ink);border-radius:1.2rem;box-shadow:0 .25rem 0 var(--ink),0 .5rem 1rem var(--shadow)}
.tool{display:flex;flex-direction:column;align-items:center;gap:.05rem;width:4.4rem;padding:.3rem .1rem .25rem;font-size:.72rem;font-weight:900}
.tool .ico{width:2.1rem;height:2.1rem}
.tool .badge{position:absolute;top:-.4rem;right:-.3rem;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:1rem;font-size:.7rem;padding:0 .35rem;min-width:1.3rem}
.modebar{position:absolute;bottom:calc(6.3rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.6rem;
  background:var(--paper);border:2px solid var(--ink);border-radius:1rem;padding:.4rem .5rem .4rem .8rem;font-weight:800;box-shadow:0 .2rem 0 var(--ink),0 .4rem .8rem var(--shadow);white-space:nowrap}
.hint{position:absolute;left:calc(.6rem + env(safe-area-inset-left));bottom:calc(6.4rem + env(safe-area-inset-bottom));max-width:19rem;background:var(--paper);border:2px solid var(--ink);border-radius:1rem;
  padding:.55rem .7rem .55rem 3rem;font-size:.85rem;font-weight:700;box-shadow:0 .2rem 0 var(--ink),0 .4rem .8rem var(--shadow);line-height:1.3}
.hint img.who{position:absolute;left:.3rem;top:.4rem;width:2.4rem;height:2.4rem}
.hint .x{position:absolute;right:.2rem;top:.05rem;font-weight:900;padding:.2rem .4rem;cursor:pointer;opacity:.6}
.alerts{position:absolute;top:calc(4.4rem + env(safe-area-inset-top));left:calc(.5rem + env(safe-area-inset-left));display:flex;flex-direction:column;gap:.4rem;align-items:flex-start}
.pill.alert{font-size:.85rem;padding:.15rem .6rem .15rem .2rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.pill.alert .ico{width:1.5rem;height:1.5rem}
.pill.alert.good{background:#dff3c8}
.pill.alert.bad{background:#ffe0d6;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,88%,100%{transform:none}92%{transform:rotate(-4deg)}96%{transform:rotate(4deg)}}
.warnbox{margin-top:.5rem;padding:.45rem .55rem;background:#fff0e8;border:2px solid #c8302a;border-radius:.8rem}
.warnbox .t{display:flex;align-items:center;gap:.3rem;color:#a8281e}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.tile{background:#fff8e8;border:2px solid var(--ink);border-radius:.8rem;padding:.35rem .5rem}
.tile b{display:block;font-size:1.25rem;font-weight:900}
.chartbox{background:#fffaf0;border:2px solid var(--ink);border-radius:.8rem;padding:.3rem}
.chartbox canvas{display:block;width:100%;height:11rem;touch-action:none}
.hbar{display:flex;align-items:center;gap:.35rem;margin:.22rem 0;font-size:.8rem;font-weight:800}
.hbar .ico{width:1.3rem;height:1.3rem}
.hbar .nm{width:7.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .trk{flex:1;height:.7rem;border-radius:.2rem}
.hbar .trk i{display:block;height:100%;background:#e8aa2a;border-radius:0 .25rem .25rem 0}
.hbar .v{width:3.6rem;text-align:right}
input.txt{font:inherit;font-size:1.2rem;font-weight:800;width:100%;max-width:18rem;padding:.5rem .7rem;border:2px solid var(--ink);border-radius:.7rem;background:#fffaf0;color:var(--ink);margin:.4rem 0}
#fps{position:absolute;left:.5rem;bottom:.3rem;color:#fff;font:700 .75rem monospace;text-shadow:0 1px 2px #000;pointer-events:none}

/* ---------- panels */
#panel,.panelghost{position:fixed;top:calc(4.6rem + env(safe-area-inset-top));right:calc(.6rem + env(safe-area-inset-right));bottom:calc(6.6rem + env(safe-area-inset-bottom));width:min(27rem,94vw);z-index:20;
  display:flex;flex-direction:column;background:var(--paper);border:2.5px solid var(--ink);border-radius:1.2rem;box-shadow:0 .3rem 0 var(--ink),0 .8rem 1.6rem var(--shadow);
  animation:slidein .3s ease-out}
.panelghost{animation:none;pointer-events:none;z-index:19;margin:0;right:auto;bottom:auto}
#panel::before,.panelghost::before{content:"";position:absolute;top:.35rem;right:.35rem;bottom:.35rem;left:.35rem;border:1.5px dashed rgba(106,74,50,.45);border-radius:.9rem;pointer-events:none}
@keyframes slidein{0%{transform:translateX(2.4rem) scale(.96);opacity:0}55%{transform:translateX(-.4rem) scale(1.01);opacity:1}100%{transform:none;opacity:1}}
.ph{display:flex;align-items:center;gap:.5rem;padding:.7rem .8rem .5rem;border-bottom:2px solid rgba(61,42,31,.15)}
.ph h2{margin:0;font-size:1.25rem;font-weight:900;flex:1;line-height:1.1}
.ph h2 small{display:block;font-size:.75rem;font-weight:700;color:var(--ink2)}
.ph .ico{width:2.4rem;height:2.4rem}
.close{width:2.3rem;height:2.3rem;border-radius:50%;padding:0;font-size:1.2rem}
.pb{flex:1;overflow-y:auto;padding:.6rem .8rem .9rem;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:.3rem;padding:.4rem .8rem 0;flex-wrap:wrap}
.tab{font-size:.8rem;padding:.3rem .6rem}
.card{background:#fffaf0;border:2px solid var(--ink);border-radius:.9rem;padding:.55rem .6rem;margin-bottom:.55rem;box-shadow:0 .15rem 0 rgba(61,42,31,.6)}
.card.locked{opacity:.55;background:#efe4cc}
.card.sel{background:#eaf7d8;border-color:var(--green2);box-shadow:0 .15rem 0 var(--green2)}
.row{display:flex;align-items:center;gap:.5rem}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.t{font-weight:900;font-size:.98rem}
.s{font-size:.78rem;color:var(--ink2);font-weight:700;line-height:1.25}
.n{font-weight:900;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:.15rem;background:#f4e4bc;border:1.5px solid rgba(61,42,31,.5);border-radius:1rem;padding:.05rem .4rem .05rem .1rem;font-size:.78rem;font-weight:900;margin:.1rem .1rem 0 0}
.chip.bad{background:#f8d0c8;border-color:#b03a2a}
.chip.ok{background:#d8f0c0;border-color:#3f7f25}
.arrow{font-weight:900;color:var(--ink2);margin:0 .15rem}
.cost{display:inline-flex;align-items:center;gap:.15rem;font-weight:900}
.cost.no{color:#b03a2a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.45rem}
.cell{background:#fffaf0;border:2px solid var(--ink);border-radius:.8rem;padding:.3rem .2rem;text-align:center;font-size:.72rem;font-weight:800;box-shadow:0 .12rem 0 rgba(61,42,31,.6);position:relative;cursor:pointer}
.cell .ico{width:2.3rem;height:2.3rem;display:block;margin:0 auto}
.cell .q{position:absolute;top:.1rem;right:.3rem;font-weight:900;font-size:.8rem}
.cell.sel{background:#eaf7d8;border-color:var(--green2)}
.cell.locked{opacity:.4}
.sec{font-weight:900;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:.7rem 0 .35rem;display:flex;align-items:center;gap:.4rem}
.sec::after{content:"";flex:1;border-top:2px dotted rgba(106,74,50,.4)}
.stat{display:flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:800;margin:.12rem 0}
.stat b{width:3.6rem}
.statbar{flex:1;height:.45rem;background:#e2d2ae;border-radius:1rem;overflow:hidden;border:1px solid rgba(61,42,31,.4)}
.statbar i{display:block;height:100%;background:var(--green)}
.bimg{width:4.2rem;height:4.2rem;object-fit:contain;flex:none}
.swatch{width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid var(--ink);display:inline-block;vertical-align:middle}
.chain{display:flex;align-items:center;flex-wrap:wrap;gap:.1rem;font-size:.75rem;font-weight:800;margin:.25rem 0}
.chain .st{display:inline-flex;flex-direction:column;align-items:center;min-width:2.6rem}
.chain .st .ico{width:1.7rem;height:1.7rem}
.chain .via{font-size:.62rem;color:var(--ink2);display:flex;flex-direction:column;align-items:center;margin:0 .1rem}
.toggle{display:inline-flex;border:2px solid var(--ink);border-radius:.7rem;overflow:hidden}
.toggle button{font:inherit;font-weight:800;font-size:.8rem;border:0;padding:.3rem .6rem;background:#f4e4bc;color:var(--ink)}
.toggle button.on{background:var(--green);color:#fff}
.toggle button+button{border-left:2px solid var(--ink)}
input[type=range]{width:100%;accent-color:var(--green);height:1.6rem}
.setrow{display:flex;align-items:center;gap:.6rem;margin:.55rem 0;font-weight:800}
.setrow > span:first-child{width:7.5rem;flex:none}
.p{font-size:.88rem;line-height:1.45;font-weight:600}
.p b{font-weight:900}

/* ---------- popups & toasts */
#pop{position:fixed;z-index:25;background:var(--paper);border:2px solid var(--ink);border-radius:1rem;padding:.5rem .6rem;box-shadow:0 .2rem 0 var(--ink),0 .5rem 1rem var(--shadow);min-width:11rem;transform:translate(-50%,-110%)}
#pop::after{content:"";position:absolute;left:50%;bottom:-.55rem;width:.9rem;height:.9rem;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
#toasts{position:fixed;top:calc(5rem + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
.toast{background:var(--paper);border:2px solid var(--ink);border-radius:2rem;padding:.35rem .9rem .35rem .4rem;font-weight:800;display:flex;align-items:center;gap:.4rem;box-shadow:0 .2rem 0 var(--ink),0 .4rem .8rem var(--shadow);animation:toastin .25s ease-out}
.toast.bad{background:#fbe0d8}
@keyframes toastin{0%{transform:translateY(-1rem) scale(.8);opacity:0}60%{transform:translateY(.15rem) scale(1.05);opacity:1}100%{transform:none;opacity:1}}
#modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(30,20,10,.55);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:1.4rem;padding:1.2rem 1.4rem;max-width:min(34rem,92vw);max-height:88vh;overflow:auto;box-shadow:0 .35rem 0 var(--ink),0 1rem 2rem rgba(0,0,0,.4);text-align:center;touch-action:pan-y}
.mbox::before{content:"";position:absolute;top:.4rem;right:.4rem;bottom:.4rem;left:.4rem;border:1.5px dashed rgba(106,74,50,.45);border-radius:1rem;pointer-events:none}
.mbox h2{margin:.2rem 0 .6rem;font-size:1.6rem;font-weight:900}
.mbox .btns{display:flex;gap:.6rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.burst{animation:burst 1s ease-out}
@keyframes burst{0%{transform:scale(.3) rotate(-20deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1)}}
.slot{display:flex;align-items:center;gap:.7rem;text-align:left}
.loading{flex-direction:column;text-align:center;padding:1.5rem;position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;background:#2f5a2c;color:#fff6dc;font-weight:900;font-size:1.4rem;z-index:100}

.seasonpill{line-height:1.05;font-size:.9rem;padding:.2rem .7rem .2rem .35rem;cursor:pointer}
.seasonpill small{font-size:.68rem;font-weight:800;color:var(--ink2)}
.semoji{font-size:1.5rem;line-height:1}
.sdots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:.15rem}
.sdots i{width:.5rem;height:.5rem;border-radius:50%;border:1px solid rgba(61,42,31,.55);display:inline-block}
.cell .sdots{display:flex;justify-content:center;margin:.1rem 0 0}
.cell .hv{font-size:.66rem;font-weight:900;color:#3f7f25}
.cell.off{opacity:.45;filter:saturate(.4)}
.seatabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.seatabs .btn{flex-direction:column;padding:.3rem .2rem;font-size:.75rem}
.seatabs small{font-size:.6rem}
.ptab-ic{display:block;min-height:1.2rem}
/* tablets: bigger touch targets */
/* ---------- v1.7: weight and motion */
.btn{transition:top .05s,box-shadow .05s,transform .2s cubic-bezier(.34,1.8,.64,1)}
.btn:active{transform:scale(.94)}
.cell{transition:transform .2s cubic-bezier(.34,1.8,.64,1)}
.cell:active{transform:scale(.92)}
.mbox{animation:mpop .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes mpop{from{transform:scale(.78) translateY(1.2rem);opacity:0}to{transform:none;opacity:1}}
.bump{animation:bump .32s cubic-bezier(.34,1.8,.64,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
.shake{animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-.3rem) rotate(-2deg)}40%{transform:translateX(.3rem) rotate(2deg)}60%{transform:translateX(-.2rem)}80%{transform:translateX(.2rem)}}
.bar > i{position:relative;overflow:hidden}
.bar > i::after{content:"";position:absolute;top:0;bottom:0;left:0;width:2.2rem;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-3rem);animation:shimmer 2.8s linear infinite}
@keyframes shimmer{0%{transform:translateX(-3rem)}55%,100%{transform:translateX(32rem)}}
.bar.full{animation:barflash .7s ease-out}
@keyframes barflash{0%{box-shadow:0 0 0 0 rgba(255,225,110,.95);filter:brightness(1.7)}100%{box-shadow:0 0 0 .7rem rgba(255,225,110,0);filter:none}}
.nudge{animation:toolnudge 1.3s ease-in-out infinite}
@keyframes toolnudge{0%,100%{box-shadow:0 .22rem 0 var(--ink),0 0 0 0 rgba(255,215,80,.95)}50%{box-shadow:0 .22rem 0 var(--ink),0 0 0 .55rem rgba(255,215,80,0)}}
/* Pip's requests */
.hint{width:19rem;cursor:default}
.hint .qrow{display:flex;align-items:center;gap:.4rem;margin-top:.35rem}
.hint .qn{font-weight:900;font-size:.8rem;white-space:nowrap}
.hint .claim{margin-top:.4rem;width:100%}
.hint.ready{background:#eaf7d8;animation:readyglow 1.6s ease-in-out infinite}
@keyframes readyglow{0%,100%{box-shadow:0 .2rem 0 var(--ink),0 0 0 0 rgba(120,210,90,.9)}50%{box-shadow:0 .2rem 0 var(--ink),0 0 0 .6rem rgba(120,210,90,0)}}
.hint.mini{width:3.4rem;height:3.4rem;padding:.25rem;border-radius:50%;cursor:pointer}
.hint.mini img.who{position:static;width:2.6rem;height:2.6rem}
.hint.mini .dot{position:absolute;top:-.3rem;right:-.3rem;background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:1rem;width:1.4rem;height:1.4rem;font-size:.85rem;font-weight:900;display:flex;align-items:center;justify-content:center}
/* coins, banners */
#fxl{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:60;overflow:hidden}
.fcoin{position:absolute;left:0;top:0;width:1.5rem;height:1.5rem;margin:-.75rem 0 0 -.75rem;will-change:transform}
.gain{position:absolute;font-weight:900;font-size:1.05rem;color:#ffe48a;-webkit-text-stroke:.22em var(--ink);paint-order:stroke fill;animation:gain 1.1s ease-out forwards}
@keyframes gain{0%{transform:translateY(0) scale(.6);opacity:0}18%{transform:translateY(.35rem) scale(1.18);opacity:1}100%{transform:translateY(1.7rem) scale(1);opacity:0}}
.banner{position:absolute;top:21%;left:50%;display:flex;align-items:center;gap:.7rem;padding:.55rem 1.6rem .55rem 1rem;background:linear-gradient(#ffe89a,#f2b83a);border:3px solid var(--ink);border-radius:1.2rem;
  box-shadow:0 .35rem 0 var(--ink),0 1rem 2rem rgba(0,0,0,.35);white-space:nowrap;animation:banner 2s cubic-bezier(.2,.9,.3,1) forwards;max-width:94vw}
.banner b{display:block;font-size:1.4rem;font-weight:900;line-height:1.1}
.banner span{font-size:.88rem;font-weight:800;color:var(--ink2)}
.banner.big{top:27%;padding:.9rem 2.4rem .9rem 1.4rem;animation-duration:2.3s}
.banner.big b{font-size:2.6rem}
.banner.big .ico{width:4.6rem;height:4.6rem}
@keyframes banner{0%{transform:translate(-170vw,-50%) rotate(-6deg)}15%{transform:translate(-45%,-50%) rotate(2deg)}23%{transform:translate(-51%,-50%) rotate(-1deg)}30%,76%{transform:translate(-50%,-50%) rotate(0)}100%{transform:translate(170vw,-50%) rotate(6deg)}}
/* following a Meeple, and the postcard bar */
#followPill{bottom:auto;top:calc(4.5rem + env(safe-area-inset-top));cursor:pointer;z-index:12}
#photoBar{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom));z-index:30;max-width:96vw;flex-wrap:wrap;justify-content:center;white-space:normal}
/* mastery stars and badges */
.mstar{letter-spacing:-.04em;font-size:.95em}
.mstar .b{color:#b87333}.mstar .v{color:#8a96a0}.mstar .g{color:#e8aa2a}.mstar .o{color:#d8c8a8}
.badge{display:inline-flex;align-items:center;gap:.2rem;background:#fff0c0;border:1.5px solid var(--ink);border-radius:1rem;padding:.05rem .45rem;font-size:.78rem;font-weight:900;margin:.12rem .12rem 0 0}
.badge.off{opacity:.4;filter:grayscale(1);background:#efe4cc}
@media (pointer:coarse){
  .btn.sm{min-height:2.4rem;padding:.35rem .7rem}
  .toggle button{min-height:2.3rem;padding:.35rem .75rem}
  .cell{padding:.4rem .2rem}
  .close{width:2.8rem;height:2.8rem}
  .pb{padding-bottom:1.4rem}
}
@media (max-width:700px){
  html{font-size:14px}
  #panel{top:auto;left:.4rem;right:.4rem;width:auto;height:58vh;bottom:calc(6.2rem + env(safe-area-inset-bottom))}
  .tool{width:3.6rem}
  .goal .reqs{display:none}
}
@media (max-height:520px){ html{font-size:13px} }
.install{margin-top:.9rem;max-width:18rem;text-align:center;background:var(--paper);border:2px solid var(--ink);border-radius:.8rem;padding:.45rem .8rem;font-size:.82rem;font-weight:800;color:var(--ink2);box-shadow:0 .22rem 0 var(--ink)}
</style>

// Startup safety net, deliberately old-style JavaScript so it works on any WebView.
(function () {
  var shown = false;
  function chromeVer() { var m = /Chrome\/(\d+)/.exec(navigator.userAgent); return m ? +m[1] : 0; }
  function show(msg) {
    if (shown || window.__booted) return; shown = true;
    var el = document.getElementById('loading'); if (!el) return;
    var v = chromeVer();
    el.innerHTML = '<span>Oh no, the seeds didn\'t sprout.</span>' +
      '<div style="font-size:.9rem;font-weight:700;max-width:34rem;margin-top:1rem;line-height:1.4">' +
      (v && v < 70 ? 'Your tablet\'s <b>Android System WebView</b> is version ' + v + ', which is too old. Open the Play Store, search for <b>Android System WebView</b>, tap <b>Update</b>, then reopen the game.<br><br>' : '') +
      'Error details (send these to whoever is fixing it):</div>' +
      '<pre style="white-space:pre-wrap;font-size:.75rem;background:rgba(0,0,0,.3);padding:.8rem;border-radius:.6rem;max-width:90vw;text-align:left;user-select:text;-webkit-user-select:text">' +
      String(msg).replace(/</g, '&lt;') + '\n\nSteps: ' + (window.__stage || []).join(' > ') + (window.__artPct != null ? ' (art ' + window.__artPct + '%)' : '') +
      '\nreadyState=' + document.readyState + ' visibility=' + document.visibilityState + ' size=' + innerWidth + 'x' + innerHeight +
      '\nWebView: Chrome ' + v + '\n' + navigator.userAgent.replace(/</g, '&lt;') + '</pre>';
  }
  window.__bootError = function (e) { show((e && (e.stack || e.message)) || e); };
  window.addEventListener('error', function (e) { show((e.message || 'Script error') + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
  // blocked/missing files don't raise normal errors; catch them in the capture phase
  window.addEventListener('error', function (e) { var t = e.target; if (t && t !== window && (t.src || t.href)) show('Could not load file: ' + (t.src || t.href)); }, true);
  window.addEventListener('unhandledrejection', function (e) { show(e.reason && (e.reason.stack || e.reason.message) || e.reason); });
  setTimeout(function () { if (!window.__booted) show('Still loading after 30 seconds (no error was reported).'); }, 30000);
  window.__stage = ['page start'];
})();
</script>

// goods are worth a markup over their ingredients plus a little for the time they take
(function priceGoods() {
  const byOut = {}; RECIPES.forEach(r => byOut[r.out[0]] = r);
  const val = id => {
    if (ITEM[id]) return ITEM[id].price;
    const r = byOut[id];
    let v = 0; for (const k in r.in) v += val(k) * r.in[k];
    const p = Math.max(3, Math.round((v * 1.35 + r.t * 0.09) / r.out[1]));
    ITEM[id] = { id, name: GOOD[id].name, price: p, crop: false };
    return p;
  };
  GOODS.forEach(g => val(g.id));
})();

// ---------------------------------------------------------------- meeple
function meeplePath(g) {
  // classic meeple silhouette; feet at y=0, ~22 tall, ~22 wide
  g.beginPath();
  g.arc(0, -17.6, 4.6, 0, Math.PI * 2);
  g.moveTo(0, -13.2);
  const half = s => {
    g.quadraticCurveTo(s * 4.5, -13.6, s * 9, -12.6);
    g.quadraticCurveTo(s * 11.8, -11.6, s * 10.6, -9);
    g.quadraticCurveTo(s * 9.6, -7.8, s * 5.6, -8.4);
    g.quadraticCurveTo(s * 5, -4.6, s * 8.6, -1.2);
    g.quadraticCurveTo(s * 9.4, 0.4, s * 7, 0.4);
    g.lineTo(s * 3, 0.4);
    g.quadraticCurveTo(s * 1.4, -3.8, 0, -4.4);
  };
  half(1); g.moveTo(0, -13.2); half(-1);
}
function meepleSprite(col, S) {
  return makeSprite(26, 26, 13, 24, g => {
    // body silhouette filled as a single shape (head circle + body)
    g.save();
    meeplePath(g);
    g.fillStyle = lgrad(g, -10, -22, 10, 0, [shade(col, 0.35), col, shade(col, -0.35)]);
    g.fill('nonzero');
    // soft side shading
    g.clip('nonzero');
    g.fillStyle = rgba(shade(col, -0.6), 0.25); g.fillRect(3, -24, 10, 26);
    g.fillStyle = rgba('#ffffff', 0.18); g.beginPath(); g.ellipse(-4, -12, 3, 1.4, -0.3, 0, 6.28); g.fill();
    g.restore();
    meeplePath(g); stroke(g, shade(col, -0.65), 0.8);
    // face
    ell(g, -1.7, -18, 0.75, 1.05, '#2a1d14'); ell(g, 1.7, -18, 0.75, 1.05, '#2a1d14');
    ell(g, -1.9, -18.4, 0.25, 0.3, '#fff'); ell(g, 1.5, -18.4, 0.25, 0.3, '#fff');
    ell(g, -3, -16.4, 1, 0.55, rgba('#ff7a8a', 0.55)); ell(g, 3, -16.4, 1, 0.55, rgba('#ff7a8a', 0.55));
    g.beginPath(); g.arc(0, -16.6, 0.9, 0.2, Math.PI - 0.2); stroke(g, '#2a1d14', 0.45);
    ell(g, -1.6, -20.6, 1.6, 0.9, rgba('#ffffff', 0.35));
  }, { edge: 1.1, S: S || Math.max(2, ART.S) });
}

// ---------------------------------------------------------------- plants on plots
// p: growth 0..1 ; ripe flag draws fruit. drawn around (0,0) = tile centre bottom area.
const PLANT = {
  carrot(g, p, ripe) {
    for (let i = -1; i <= 1; i++) leaf(g, i * 0.8, 0, -Math.PI / 2 + i * 0.5, 12 * p, 2.5 * p, '#5aa335');
    leaf(g, 0, 0, -Math.PI / 2 + 0.15, 14 * p, 2.2 * p, '#6cbf45');
    if (ripe) { g.beginPath(); g.moveTo(-3, 0); g.quadraticCurveTo(0, -3, 3, 0); g.quadraticCurveTo(0, 3, -3, 0); g.fillStyle = '#f07a2a'; g.fill(); stroke(g, INK, 0.6); }
  },
  wheat(g, p, ripe) {
    const col = ripe ? '#e9c25a' : '#8fbf4a';
    for (let i = -2; i <= 2; i++) {
      g.beginPath(); g.moveTo(i * 1.2, 0); g.quadraticCurveTo(i * 2, -10 * p, i * 2.6, -20 * p); stroke(g, ripe ? '#c8a040' : '#6a9a3a', 0.9);
      if (p > 0.6) for (let k = 0; k < 4; k++) ell(g, i * 2.6 + (k % 2 - 0.5) * 1.4, -20 * p - k * 1.8, 1, 1.6, col, shade(col, -0.4), 0.4);
    }
  },
  potato(g, p, ripe) {
    for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + (i - 3) * 0.45; leaf(g, 0, -2, a, 10 * p, 4 * p, i % 2 ? '#4f8f3a' : '#5fa046'); }
    if (ripe) { [[-5, -10], [3, -12], [6, -7]].forEach(([x, y]) => { for (let k = 0; k < 5; k++) { const a = k / 5 * 6.28; ell(g, x + Math.cos(a) * 1.4, y + Math.sin(a) * 1.4, 1.1, 1.1, '#f4f0ff'); } ell(g, x, y, 0.8, 0.8, '#f2d23a'); }); ell(g, -6, 1, 3, 2, '#c69a62', INK, 0.5); }
  },
  cabbage(g, p, ripe) {
    for (let i = 0; i < 6; i++) { const a = -Math.PI + i / 5 * Math.PI; leaf(g, 0, -3, a, 10 * p, 5 * p, '#6fb352', false); }
    if (p > 0.55) { blob(g, 0, -5, 6.5 * p, ripe ? '#b5e08f' : '#8fcf6a', 0.3, -0.2); stroke(g, shade('#6fb352', -0.4), 0.6); g.beginPath(); g.arc(-1, -4, 3 * p, -2.6, -0.4); stroke(g, rgba('#e8f7d0', 0.9), 0.5); }
  },
  sugarbeet(g, p, ripe) {
    for (let i = 0; i < 5; i++) leaf(g, 0, -1, -Math.PI / 2 + (i - 2) * 0.42, 15 * p, 4.5 * p, i % 2 ? '#4a9a3c' : '#5aaa48');
    g.strokeStyle = rgba('#c2306a', 0.7); g.lineWidth = 0.6;
    for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * 0.42; g.beginPath(); g.moveTo(0, -1); g.lineTo(Math.cos(a) * 11 * p, -1 + Math.sin(a) * 11 * p); g.stroke(); }
    if (ripe) { ell(g, 0, 0, 4.5, 3, '#c2306a', INK, 0.6); }
  },
  strawberry(g, p, ripe) {
    for (let i = 0; i < 6; i++) { const a = -Math.PI + 0.3 + i / 5 * (Math.PI - 0.6); leaf(g, 0, -1, a, 9 * p, 4 * p, '#3f9a3e'); }
    if (p > 0.6) [[-6, -2], [5, -3]].forEach(([x, y]) => { for (let k = 0; k < 5; k++) { const a = k / 5 * 6.28; ell(g, x + Math.cos(a) * 1.3, y - 6 + Math.sin(a) * 1.3, 1, 1, '#fff'); } ell(g, x, y - 6, 0.7, 0.7, '#f2d23a'); });
    if (ripe) [[-4, 0], [4, 1], [0, -1]].forEach(([x, y]) => { g.beginPath(); g.moveTo(x, y + 3.5); g.bezierCurveTo(x - 3.5, y, x - 2.5, y - 3, x, y - 2.2); g.bezierCurveTo(x + 2.5, y - 3, x + 3.5, y, x, y + 3.5); g.fillStyle = '#e8344a'; g.fill(); stroke(g, INK, 0.5); });
  },
  garlic(g, p, ripe) {
    for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(i * 0.6, 0); g.quadraticCurveTo(i * 2.5, -9 * p, i * 4, -17 * p - Math.abs(i)); stroke(g, '#7fae4c', 1.5); }
    if (ripe) { g.beginPath(); g.moveTo(0, -5); g.bezierCurveTo(5, -4, 5, 2, 0, 2); g.bezierCurveTo(-5, 2, -5, -4, 0, -5); g.fillStyle = '#efe6d2'; g.fill(); stroke(g, INK, 0.6); }
  },
  chili(g, p, ripe) {
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -10 * p); stroke(g, '#4a7a2a', 1.4);
    for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + (i - 3.5) * 0.42; leaf(g, 0, -6 * p - (i % 3) * 2 * p, a, 8 * p, 3 * p, '#3e8a33'); }
    if (ripe) [[-5, -6], [4, -8], [-1, -3], [6, -3]].forEach(([x, y], i) => { g.save(); g.translate(x, y); g.rotate(0.2 * (i - 1.5)); g.beginPath(); g.moveTo(-1.2, -2); g.quadraticCurveTo(1.6, -2, 1, 2); g.quadraticCurveTo(0, 5, -1, 5.5); g.quadraticCurveTo(-1.6, 1, -1.2, -2); g.fillStyle = '#d8241c'; g.fill(); stroke(g, INK, 0.5); g.restore(); });
  },
  barley(g, p, ripe) {
    const col = ripe ? '#d7bf7c' : '#a7c25a';
    for (let i = -2; i <= 2; i++) {
      g.beginPath(); g.moveTo(i, 0); g.quadraticCurveTo(i * 2, -10 * p, i * 3 + 2, -19 * p); stroke(g, ripe ? '#b8a060' : '#7aa040', 0.9);
      if (p > 0.6) { g.save(); g.translate(i * 3 + 2, -19 * p); g.rotate(0.6); for (let k = 0; k < 4; k++) { ell(g, 0, k * 1.6, 1, 1.2, col); g.beginPath(); g.moveTo(0, k * 1.6); g.lineTo(-3, k * 1.6 - 4); stroke(g, rgba(col, 0.9), 0.35); } g.restore(); }
    }
  },
  hops(g, p, ripe) {
    g.fillStyle = '#8a6a42'; g.fillRect(-1, -30 * Math.max(p, 0.5), 2, 30 * Math.max(p, 0.5)); g.strokeStyle = INK; g.lineWidth = 0.5; g.strokeRect(-1, -30 * Math.max(p, 0.5), 2, 30 * Math.max(p, 0.5));
    for (let k = 0; k < 8 * p; k++) { const y = -2 - k * 3.4, s = k % 2 ? 1 : -1; leaf(g, s * 1, y, s > 0 ? -0.3 : Math.PI + 0.3, 6.5, 2.8, '#4f9a3a'); }
    if (ripe) for (let k = 0; k < 5; k++) { const x = (k % 2 ? 4 : -4), y = -6 - k * 4.5; g.beginPath(); g.ellipse(x, y, 1.8, 2.6, 0, 0, 6.28); g.fillStyle = '#c4e870'; g.fill(); stroke(g, shade('#a9d455', -0.5), 0.5); }
  },
  apple(g, p, ripe) {
    const s = Math.max(p, 0.4);
    g.fillStyle = '#7a5232'; g.fillRect(-1.4, -12 * s, 2.8, 12 * s);
    g.strokeStyle = INK; g.lineWidth = 0.5; g.strokeRect(-1.4, -12 * s, 2.8, 12 * s);
    [[-5, -16], [5, -16], [0, -21], [-2, -14], [3, -13]].forEach(([x, y]) => blob(g, x * s, y * s, 6.5 * s, '#4b9a3c', 0.3, -0.3));
    if (ripe) [[-6, -14], [5, -18], [1, -12], [-1, -22], [6, -12]].forEach(([x, y]) => { blob(g, x, y, 2.2, '#d8392b', 0.4, -0.3); stroke(g, INK, 0.4); });
  },
  blueberry(g, p, ripe) {
    [[-5, -5], [5, -5], [0, -9], [-2, -2], [3, -1]].forEach(([x, y]) => blob(g, x * p, y * p, 5.2 * p, '#3f8a46', 0.3, -0.3));
    for (let i = 0; i < 10; i++) leaf(g, (hash2(i, 1, 9) - 0.5) * 14 * p, -2 - hash2(i, 2, 9) * 10 * p, hash2(i, 3, 9) * 6.28, 3.5 * p, 1.5 * p, '#57a35a', false);
    if (ripe) for (let i = 0; i < 9; i++) { const x = (hash2(i, 4, 9) - 0.5) * 12, y = -2 - hash2(i, 5, 9) * 9; blob(g, x, y, 1.5, '#4c5fb8', 0.4, -0.3); }
  },
  corn(g, p, ripe) {
    for (let i = -1; i <= 1; i += 2) {
      const x = i * 4;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, -30 * p); stroke(g, '#5a9a3a', 1.8);
      for (let k = 0; k < 4; k++) leaf(g, x, -5 - k * 6 * p, (k % 2 ? -0.5 : Math.PI + 0.5), 10 * p, 2.2 * p, '#6fb04a');
      if (ripe) { g.save(); g.translate(x + 2, -17); g.rotate(0.35); ell(g, 0, 0, 1.9, 4.5, '#f2cf3a', INK, 0.5); leaf(g, 0, 4, -1.7, 7, 1.8, '#8fc06a'); g.restore(); }
      if (p > 0.7) { g.beginPath(); g.moveTo(x, -30 * p); g.lineTo(x - 2, -34 * p); g.moveTo(x, -30 * p); g.lineTo(x + 2, -34 * p); stroke(g, '#c8a040', 0.8); }
    }
  },
  grapes(g, p, ripe) {
    g.fillStyle = '#8a6a42';
    g.fillRect(-12, -22, 2, 22); g.fillRect(10, -22, 2, 22); g.fillRect(-12, -22, 24, 1.6);
    g.strokeStyle = INK; g.lineWidth = 0.5; g.strokeRect(-12, -22, 2, 22); g.strokeRect(10, -22, 2, 22);

    for (let i = 0; i < 7 * p; i++) leaf(g, -9 + i * 3, -19 + (i % 2) * 2, Math.PI / 2 + (i % 2 ? 0.6 : -0.6), 6, 3, '#5a9a3a', false);
    if (ripe) [[-6, -15], [5, -14]].forEach(([x, y]) => { [[0, 0], [2, 0], [-2, 0], [1, 2], [-1, 2], [0, 4]].forEach(([a, b]) => blob(g, x + a * 1.1, y + b * 1.1, 1.5, '#7b3f9e', 0.4, -0.3)); });
  },
  pumpkin(g, p, ripe) {
    g.beginPath(); g.moveTo(-14, 2); g.bezierCurveTo(-6, -4, 2, 4, 14, -2); stroke(g, '#5a8a2a', 1.3);
    for (let i = 0; i < 5; i++) { const x = -12 + i * 6; blob(g, x, -3 - (i % 2) * 2, 4.5 * p, '#4f9438', 0.3, -0.25); }
    if (ripe) { g.save(); g.translate(1, -3); for (let i = -1; i <= 1; i++) { g.beginPath(); g.ellipse(i * 3, 0, 4, 5.4, 0, 0, 6.28); g.fillStyle = lgrad(g, i * 3 - 4, 0, i * 3 + 4, 0, ['#ffb050', '#f08a1c', '#b8600a']); g.fill(); stroke(g, shade('#f08a1c', -0.55), 0.5); } g.beginPath(); g.moveTo(0, -5); g.lineTo(1, -7.5); stroke(g, '#5a7a2a', 1.6); g.restore(); }
    else if (p > 0.6) { blob(g, 2, -2, 2.6, '#b8d060'); }

  juniper(g, p, ripe) {

    }
    if (ripe) for (let i = 0; i < 8; i++) blob(g, (hash2(i, 1, 5) - 0.5) * 14, -3 - hash2(i, 2, 5) * 14, 1.3, '#6a84bb', 0.4, -0.3);

};

function plantSprite(cropId, stage) {
  const key = 'plant_' + cropId + '_' + stage;
  if (ART.sprites[key]) return ART.sprites[key];
  const crop = CROP[cropId];
  const layout = SINGLE_PLANT[cropId] ? [[0, 6]] : [[-10, -3], [10, -3], [-10, 11], [10, 11]];
  const s = makeSprite(T, T + 30, T / 2, T / 2 + 30, g => {
    layout.forEach(([x, y], i) => {
      g.save(); g.translate(x, y);
      if (stage === 0) { ell(g, 0, 0, 3.5, 1.8, '#6a4528'); ell(g, -1, -0.5, 0.7, 0.5, '#e8d8a0'); ell(g, 1.2, 0.2, 0.7, 0.5, '#e8d8a0'); }
      else if (stage === 1) { ell(g, 0, 0.5, 3, 1.4, '#6a4528'); leaf(g, 0, 0, -2.2, 5, 2, crop.leaf); leaf(g, 0, 0, -0.9, 5, 2, shade(crop.leaf, 0.15)); }
      else { const sc = layout.length === 1 ? 1.15 : 0.62; g.scale(sc, sc); PLANT[cropId](g, stage === 2 ? 0.6 : 1, stage === 3); }
      g.restore();
    });
  }, { edge: 0.9 });
  ART.sprites[key] = s;
  return s;
}

// ---------------------------------------------------------------- buildings
// origin: footprint bottom-centre. Footprint spans x∈[-w*T/2, w*T/2], y∈[-h*T, 0].
function bShadow() { /* shadows are drawn at runtime so the sticker edge doesn't wrap them */ }
function planks(g, x, y, w, h, col, vertical = true) {

<script>/* js/art4.js */
// Meeple Meadows — art, part 4: faceless running Meeples, hats, emote bubbles, soil textures,
// barnyard animals and buildings, compost, the orders board, found decorations and relics.
'use strict';

// ---------------------------------------------------------------- Meeples
// No faces: just a little body with stubby legs. frame -1 stands; 0..5 is the run cycle.
const MEEPLE_RUN_FRAMES = 6;
function meepleTorsoPath(g) {

  g.quadraticCurveTo(11.8, -11.6, 10.6, -9);
  g.quadraticCurveTo(9.6, -7.8, 5.6, -8.4);
  g.quadraticCurveTo(5.2, -7.4, 5.0, -6.6);
  g.quadraticCurveTo(0, -5.2, -5.0, -6.6);
  g.quadraticCurveTo(-5.2, -7.4, -5.6, -8.4);
  g.quadraticCurveTo(-9.6, -7.8, -10.6, -9);
  g.quadraticCurveTo(-11.8, -11.6, -9, -12.6);
  g.quadraticCurveTo(-4.5, -13.6, 0, -13.2);
  g.closePath();
}
function meepleLeg(g, hx, ang, len, col, line) {
  g.save(); g.translate(hx, -7.6); g.rotate(ang);
  rrect(g, -2.4, -1.5, 4.8, 1.5 + len, 2.3);
  g.fillStyle = lgrad(g, -2.4, 0, 2.4, 0, [shade(col, 0.2), col, shade(col, -0.3)]); g.fill();
  stroke(g, line, 0.8);

}
meepleSprite = function (col, S, frame = -1) {
  return makeSprite(26, 26, 13, 24, g => {
    const line = shade(col, -0.65);
    if (frame < 0) {
      meepleLeg(g, -2.5, 0.22, 7.3, shade(col, -0.08), line);
      meepleLeg(g, 2.5, -0.22, 7.3, shade(col, -0.08), line);
    } else {
      const ph = frame / MEEPLE_RUN_FRAMES * Math.PI * 2, s = Math.sin(ph), c = Math.cos(ph);
      // the leg swinging back is drawn first, a shade darker, so it reads as behind
      const a = { hx: 1.8, ang: -0.85 * s, len: 7.2 - 2.4 * Math.max(0, c) };
      const b = { hx: -1.8, ang: 0.85 * s, len: 7.2 - 2.4 * Math.max(0, -c) };
      const [back, front] = s > 0 ? [b, a] : [a, b];
      meepleLeg(g, back.hx, back.ang, back.len, shade(col, -0.28), line);
      meepleLeg(g, front.hx, front.ang, front.len, shade(col, -0.06), line);
    }
    g.save();
    meepleTorsoPath(g);
    g.fillStyle = lgrad(g, -10, -22, 10, 0, [shade(col, 0.35), col, shade(col, -0.35)]);
    g.fill('nonzero');
    g.clip('nonzero');
    g.fillStyle = rgba(shade(col, -0.6), 0.25); g.fillRect(3, -24, 10, 26);
    g.fillStyle = rgba('#ffffff', 0.2); g.beginPath(); g.ellipse(-4, -12, 3, 1.4, -0.3, 0, 6.28); g.fill();
    g.fillStyle = rgba('#ffffff', 0.3); g.beginPath(); g.ellipse(-1.6, -20.2, 1.8, 1, -0.3, 0, 6.28); g.fill();
    g.restore();
    meepleTorsoPath(g); stroke(g, line, 0.8);

};

// ---------------------------------------------------------------- hats (drawn around the head centre)
const HAT_DRAW = {
  straw(g) {
    ell(g, 0, -3.6, 7.6, 2.1, '#e2b85a', INK, 0.7);
    g.beginPath(); g.ellipse(0, -4.2, 4.2, 3.6, 0, Math.PI, 0); g.closePath(); g.fillStyle = lgrad(g, -4, -8, 4, -4, ['#f4d488', '#d8a848']); g.fill(); stroke(g, INK, 0.7);
    g.fillStyle = '#d8463a'; g.fillRect(-4.1, -5.4, 8.2, 1.3);
    g.strokeStyle = rgba('#a87828', 0.6); g.lineWidth = 0.4; for (let i = -6; i <= 6; i += 2) { g.beginPath(); g.moveTo(i, -4.4); g.lineTo(i * 1.15, -2.6); g.stroke(); }
  },
  flower(g) {
    const fl = [[-4.4, -2.6, '#f29ac0'], [-2.2, -4, '#ffffff'], [0.4, -4.5, '#f2d23a'], [3, -4, '#f29ac0'], [4.8, -2.6, '#a87ae8']];

    for (const [x, y, c] of fl) { leaf(g, x, y + 0.6, -0.6, 3, 1.2, '#5aa335', false); for (let k = 0; k < 5; k++) { const a = k / 5 * 6.28; ell(g, x + Math.cos(a) * 1.1, y + Math.sin(a) * 1.1, 0.95, 0.95, c, rgba(INK, 0.5), 0.3); } ell(g, x, y, 0.6, 0.6, '#f2a23a'); }
  },
  acorn(g) {
    g.beginPath(); g.ellipse(0, -1.8, 5.4, 4.6, 0, Math.PI, 0); g.closePath(); g.fillStyle = lgrad(g, -5, -6, 5, -2, ['#c8945a', '#8a5a2e']); g.fill(); stroke(g, INK, 0.7);
    g.save(); g.clip(); g.strokeStyle = rgba('#5a3a1a', 0.6); g.lineWidth = 0.4;
    for (let i = -8; i < 8; i += 1.8) { g.beginPath(); g.moveTo(i, -7); g.lineTo(i + 5, -1); g.moveTo(i + 5, -7); g.lineTo(i, -1); g.stroke(); }
    g.restore();
    g.beginPath(); g.moveTo(0, -6.3); g.quadraticCurveTo(0.5, -8.2, 1.8, -8.6); stroke(g, '#5a3a1a', 1.1);
  },
  beanie(g) {
    g.beginPath(); g.ellipse(0, -1.4, 5.2, 5.4, 0, Math.PI, 0); g.closePath(); g.fillStyle = lgrad(g, -5, -6, 5, -1, ['#f07060', '#c8382a']); g.fill(); stroke(g, INK, 0.7);
    rrect(g, -5.4, -2.6, 10.8, 2.4, 1); g.fillStyle = '#e8584a'; g.fill(); stroke(g, INK, 0.6);
    g.strokeStyle = rgba('#8a2018', 0.6); g.lineWidth = 0.4; for (let i = -4.5; i <= 4.5; i += 1.5) { g.beginPath(); g.moveTo(i, -2.4); g.lineTo(i, -0.4); g.stroke(); }
    ell(g, 0, -7.4, 1.9, 1.9, '#fbf3df', INK, 0.6);
  },
  bucket(g) {
    g.beginPath(); g.moveTo(-7, -1.2); g.quadraticCurveTo(0, -3.4, 7, -1.2); g.lineTo(5.4, -3.2); g.quadraticCurveTo(0, -4.6, -5.4, -3.2); g.closePath(); g.fillStyle = '#8a9a5a'; g.fill(); stroke(g, INK, 0.6);
    g.beginPath(); g.moveTo(-4.4, -3.4); g.lineTo(-3.6, -7.4); g.quadraticCurveTo(0, -8.4, 3.6, -7.4); g.lineTo(4.4, -3.4); g.quadraticCurveTo(0, -4.4, -4.4, -3.4); g.fillStyle = lgrad(g, -4, -8, 4, -3, ['#b0be7a', '#7a8a4a']); g.fill(); stroke(g, INK, 0.7);
    g.fillStyle = '#5a6a3a'; g.fillRect(-4.2, -4.6, 8.4, 1); leaf(g, 2.6, -5, -1, 3.2, 1.2, '#e8902a', false);
  },
  chef(g) {
    rrect(g, -4, -4.6, 8, 3.2, 0.8); g.fillStyle = '#f4f0e6'; g.fill(); stroke(g, INK, 0.6);
    [[-3, -6.8, 2.6], [0, -8, 3], [3, -6.8, 2.6]].forEach(([x, y, r]) => ell(g, x, y, r, r, '#fbfaf4', INK, 0.6));
    g.fillStyle = '#fbfaf4'; g.fillRect(-4.2, -7, 8.4, 2.4);
  },
  tophat(g) {
    ell(g, 0, -3.4, 7, 1.8, '#2a2430', INK, 0.7);
    g.beginPath(); g.moveTo(-4, -3.8); g.lineTo(-4.4, -11); g.quadraticCurveTo(0, -12, 4.4, -11); g.lineTo(4, -3.8); g.closePath(); g.fillStyle = lgrad(g, -4, 0, 4, 0, ['#4a4250', '#1e1a24']); g.fill(); stroke(g, INK, 0.7);
    ell(g, 0, -11, 4.4, 1.1, '#3a3440', INK, 0.5);
    g.fillStyle = '#8a3a4a'; g.fillRect(-4.1, -6, 8.2, 1.5);
  },
  crown(g) {
    g.beginPath(); g.moveTo(-5, -2.6); g.lineTo(-5.4, -8); g.lineTo(-2.7, -5.6); g.lineTo(0, -9.4); g.lineTo(2.7, -5.6); g.lineTo(5.4, -8); g.lineTo(5, -2.6); g.closePath();
    g.fillStyle = lgrad(g, 0, -9, 0, -2, ['#fff2a0', '#f2c23a', '#c88a10']); g.fill(); stroke(g, INK, 0.7);
    ell(g, 0, -4, 1, 1, '#d8463a', INK, 0.3); ell(g, -3.2, -3.8, 0.8, 0.8, '#3a8ad8', INK, 0.3); ell(g, 3.2, -3.8, 0.8, 0.8, '#4f9a3a', INK, 0.3);
    [[-5.4, -8], [0, -9.4], [5.4, -8]].forEach(([x, y]) => ell(g, x, y, 0.8, 0.8, '#fff6c0', INK, 0.3));
  },
};
function hatSprite(id) {
  const key = 'hat_' + id;
  if (!ART.sprites[key]) ART.sprites[key] = makeSprite(18, 16, 9, 13, g => HAT_DRAW[id](g), { edge: 0.9, S: Math.max(2, ART.S) });
  return ART.sprites[key];
}
HATS.forEach(h => {
  UI_ICON['hat_' + h.id] = g => {
    g.translate(16, 22); g.scale(2.2, 2.2);
    ell(g, 0, 0, 4.6, 4.6, '#d8c0a0', INK, 0.6);

// ---------------------------------------------------------------- emote bubbles
function drawEmote(ctx, x, y, k, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
  rrect(ctx, -7.5, -15, 15, 12.5, 5); ctx.fillStyle = '#fffaf0'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-2.5, -2.7); ctx.lineTo(0, 1.2); ctx.lineTo(2.5, -2.7); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 0.8; rrect(ctx, -7.5, -15, 15, 12.5, 5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2.5, -2.5); ctx.lineTo(0, 1.2); ctx.lineTo(2.5, -2.5); ctx.stroke();
  ctx.lineCap = 'round';
  if (k === 'heart') {
    ctx.beginPath(); ctx.moveTo(0, -5); ctx.bezierCurveTo(-5.5, -8.5, -3.2, -13.4, 0, -10.6); ctx.bezierCurveTo(3.2, -13.4, 5.5, -8.5, 0, -5); ctx.fillStyle = '#e8463a'; ctx.fill();
  } else if (k === 'note') {
    ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineWidth = 1;
    ell(ctx, -1.6, -6.4, 1.6, 1.2, INK); ell(ctx, 2.6, -7.4, 1.6, 1.2, INK);
    ctx.beginPath(); ctx.moveTo(-0.2, -6.4); ctx.lineTo(-0.2, -12.2); ctx.lineTo(4, -13.2); ctx.lineTo(4, -7.4); ctx.stroke();
  } else if (k === 'zzz') {
    ctx.fillStyle = '#5a6aa8'; ctx.font = 'bold 6px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('z', -2.6, -6.6); ctx.font = 'bold 7.5px sans-serif'; ctx.fillText('z', 2.2, -9.8);
  } else if (k === 'wow') {
    ctx.fillStyle = '#e8a020';
    ctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 2 : 4.8, an = i / 10 * Math.PI * 2 - Math.PI / 2; ctx.lineTo(Math.cos(an) * r, -8.6 + Math.sin(an) * r); } ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ---------------------------------------------------------------- soil
// Seamless soil textures, 96 world units square (it divides the 384-unit ground chunk, so beds
// line up across chunks). Dry earth is the default; wet earth is painted over watered plots.
const SOIL_TILE = 96;
const SOIL_CV = {};
function soilCanvas(wet) {
  const res = 2, c = newCanvas(SOIL_TILE * res, SOIL_TILE * res), g = c.getContext('2d'), N = SOIL_TILE;
  g.scale(res, res);
  const r = mulberry(wet ? 7771 : 3331);
  const P = wet
    ? { base: '#4a2e1a', lo: '#382213', hi: '#5e3c24', clod: '#583820', clodHi: '#80603f', clodLo: '#26160b', peb: '#7e786c' }
    : { base: '#8e6a44', lo: '#785636', hi: '#a68058', clod: '#977248', clodHi: '#c09a6c', clodLo: '#5a3e26', peb: '#c8bca8' };
  g.fillStyle = P.base; g.fillRect(0, 0, N, N);
  // draw at (x,y) and at the wrapped copies so the tile repeats without seams
  const wrap = (x, y, rad, fn) => {
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const X = x + dx * N, Y = y + dy * N;
      if (X + rad < 0 || Y + rad < 0 || X - rad > N || Y - rad > N) continue;
      fn(X, Y);
    }
  };
  for (let k = 0; k < 28; k++) {
    const x = r() * N, y = r() * N, rad = 8 + r() * 16, col = r() < 0.5 ? P.lo : P.hi;
    wrap(x, y, rad, (X, Y) => { const gr = g.createRadialGradient(X, Y, 0, X, Y, rad); gr.addColorStop(0, rgba(col, 0.6)); gr.addColorStop(1, rgba(col, 0)); g.fillStyle = gr; g.fillRect(X - rad, Y - rad, rad * 2, rad * 2); });
  }
  for (let k = 0; k < 1100; k++) { g.fillStyle = rgba(r() < 0.5 ? P.clodLo : P.clodHi, 0.3 + r() * 0.35); g.fillRect(r() * N, r() * N, 0.5 + r() * 0.7, 0.5 + r() * 0.5); }
  // crumbly clods, lit from the top left
  for (let k = 0; k < 85; k++) {
    const x = r() * N, y = r() * N, w = 1.2 + r() * 2.6, h = w * (0.55 + r() * 0.3), rot = (r() - 0.5) * 0.8;
    wrap(x, y, w + 2, (X, Y) => {
      g.save(); g.translate(X, Y); g.rotate(rot);
      ell(g, 0.45, 0.8, w, h, rgba(P.clodLo, 0.75)); ell(g, 0, 0, w, h, P.clod); ell(g, -w * 0.25, -h * 0.3, w * 0.55, h * 0.45, rgba(P.clodHi, wet ? 0.55 : 0.85));
      g.restore();
    });
  }
  for (let k = 0; k < 10; k++) {
    const x = r() * N, y = r() * N, w = 0.9 + r() * 1.4;
    wrap(x, y, w + 2, (X, Y) => { ell(g, X + 0.4, Y + 0.6, w, w * 0.7, 'rgba(0,0,0,0.25)'); ell(g, X, Y, w, w * 0.7, P.peb); ell(g, X - w * 0.3, Y - w * 0.25, w * 0.4, w * 0.3, 'rgba(255,255,255,0.5)'); });
  }
  if (!wet) {
    // hairline cracks in the dry crust
    g.strokeStyle = rgba('#4a3018', 0.5); g.lineWidth = 0.5;
    for (let k = 0; k < 8; k++) {
      const pts = []; let x = r() * N, y = r() * N, a = r() * 6.28;
      for (let j = 0; j < 5; j++) { pts.push([x, y]); a += (r() - 0.5) * 1.6; x += Math.cos(a) * (2 + r() * 3); y += Math.sin(a) * (2 + r() * 3); }
      wrap(pts[0][0], pts[0][1], 20, (X, Y) => { const ox = X - pts[0][0], oy = Y - pts[0][1]; g.beginPath(); pts.forEach(([px, py], j) => j ? g.lineTo(px + ox, py + oy) : g.moveTo(px + ox, py + oy)); g.stroke(); });
    }
  } else {
    // little puddles catching the sky, and glossy wet specks
    for (let k = 0; k < 5; k++) {
      const x = r() * N, y = r() * N, w = 2.5 + r() * 3.5, h = w * 0.45;
      wrap(x, y, w + 2, (X, Y) => {
        ell(g, X, Y, w, h, 'rgba(30,18,10,0.75)');
        g.beginPath(); g.ellipse(X, Y, w, h, 0, Math.PI * 1.1, Math.PI * 1.9); g.strokeStyle = 'rgba(170,205,225,0.45)'; g.lineWidth = 0.6; g.stroke();
        ell(g, X - w * 0.35, Y - h * 0.2, w * 0.25, h * 0.25, 'rgba(220,240,255,0.35)');
      });
    }
    for (let k = 0; k < 180; k++) { g.fillStyle = 'rgba(255,255,255,' + (0.18 + r() * 0.3).toFixed(2) + ')'; g.fillRect(r() * N, r() * N, 0.5, 0.5); }
  }

function orchardSprite(type) {
  const key = 'orch_' + type;
  if (ART.sprites[key]) return ART.sprites[key];
  const kind = TREES.find(t => t.id === type).kind;
  let s;
  if (kind === 'oak' || kind === 'birch' || kind === 'pine') s = treeSprite(kind, 0, 1);
  else if (kind === 'maple') {
    const r = mulberry(4401);
    s = makeSprite(80, 98, 40, 94, g => {
      g.beginPath(); g.moveTo(-5, 0); g.quadraticCurveTo(-3, -18, -4, -36); g.lineTo(4, -36); g.quadraticCurveTo(3, -18, 6, 0); g.closePath();
      g.fillStyle = lgrad(g, -5, 0, 6, 0, ['#8a6a52', '#6a4a36', '#4a3022']); g.fill(); stroke(g, INK, 0.9);
      const cols = ['#5a9a3a', '#4a8a30', '#6aaa42', '#d8602a', '#e8902a'];
      const puffs = []; for (let i = 0; i < 12; i++) { const a = r() * 6.28, d = r() * 16; puffs.push([Math.cos(a) * d * 1.3, -58 + Math.sin(a) * d * 0.85, 12 + r() * 6]); }
      puffs.sort((a, b) => a[1] - b[1]);
      puffs.forEach(([x, y, rr]) => blob(g, x + 1, y + 3, rr, '#2e5a22', 0, -0.2));
      puffs.forEach(([x, y, rr], i) => blob(g, x, y, rr, cols[i % 3], 0.28, -0.32));
      // little five-pointed maple leaves, a few of them already turning red
      for (let i = 0; i < 26; i++) {
        const a = r() * 6.28, d = r() * 24, x = Math.cos(a) * d * 1.25, y = -58 + Math.sin(a) * d * 0.8, c = i % 5 === 0 ? cols[3 + (i % 2)] : shade(cols[i % 3], 0.2);

        for (let k = 0; k < 10; k++) { const rr = k % 2 ? 1.2 : 3, an = k / 10 * Math.PI * 2; g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
        g.closePath(); g.fillStyle = c; g.fill(); g.restore();
      }
    }, { edge: 1.5 });
  } else {

  _plantBudget = 3;

  _plantSweep = now;

<script>/* js/world4.js */
// Meeple Meadows — v1.7 game logic: building sites that Meeples raise piece by piece, Pip's requests,
// each Meeple's own record and badges, crop mastery, benches and lantern gatherings, and the daily visitor.
'use strict';

// ---------------------------------------------------------------- building sites
// A building under construction sits in S.buildings as a "site" of the same footprint (b.of = what it
// will become). None of the working-building code knows the site types, so a half-built mill grinds nothing.
const siteType = d => 'site' + d.w + 'x' + d.h + (d.walk ? 'w' : '');
Object.keys(BUILDINGS).forEach(t => {
  const d = BUILDINGS[t], k = siteType(d);
  if (!BUILDINGS[k]) BUILDINGS[k] = { name: 'Building site', w: d.w, h: d.h, cost: 0, grow: 1, lvl: 0, cat: 'site', walk: d.walk ? 1 : 0, site: 1, desc: '' };
});
let SITES_OPEN = 0;
const SITE_N = {};            // site id -> Meeples heading to it or working on it
const BUILD_FOUND = 0.07;     // the first slice of the work is digging the foundation
// work-seconds to finish: dearer and bigger buildings take longer (the first Creator is about a minute for Pip alone)
function buildNeed(type) {
  const d = BUILDINGS[type], a = d.w * d.h;
  return Math.round((22 + 16 * Math.log10(1 + d.cost)) * (a === 1 ? 0.45 : a <= 4 ? 1 : 2));
}
// a Wonder waits between stages until its next delivery arrives
const siteWaiting = b => !!(b.con && b.con.req) && b.con.p >= b.con.need * b.con.stage / 4 - 1e-6;
const siteCap = b => { const d = BUILDINGS[b.type]; return Math.min(16, 2 * (d.w + d.h)); };
function startSite(type, x, y, cost) {
  const d = BUILDINGS[type];
  if (d.tree) return addBuilding(type, x, y);   // seedlings are planted, not built
  const b = { id: S.nextId++, type: siteType(d), of: type, x, y, con: { p: 0, need: buildNeed(type), paid: cost || 0, idle: 0 } };
  S.buildings.push(b); BMAP[b.id] = b;
  S.built[type] = (S.built[type] || 0) + 1;
  SITES_OPEN++;
  return b;
}
function releaseBuilders(b, cheer) {
  const who = [];
  for (const m of S.meeples) if (m.task && m.task.type === 'construct' && m.task.b === b.id) {
    if (!m.path.length) who.push(m.id);
    m.task = null; m.path = []; m.act = 0; m.wait = cheer ? 1.1 + Math.random() * 0.5 : 0;
    if (cheer) emote(m, 'heart', 0.8);
  }
  return who;
}
function finishSite(b) {
  const type = b.of, d = BUILDINGS[type];
  const who = releaseBuilders(b, true);
  delete b.of; delete b.con; b.type = type;
  if (d.proc) Object.assign(b, { recipe: null, repeat: true, phase: 'idle', got: {}, transit: {}, t: 0, out: 0, claim: 0 });
  if (type === 'creator') Object.assign(b, { queue: [], t: 0 });
  if (type === 'coop' || type === 'barn' || type === 'hive' || type === 'duckhouse') { const r = RECIPES.find(x => x.at === type && recipeUnlocked(x)); if (r) setRecipe(b, r.id); }
  if (type === 'greenhouse') {
    for (let yy = 0; yy < d.h; yy++) for (let xx = 0; xx < d.w; xx++) {
      const t = idx(b.x + xx, b.y + yy);
      if (yy < d.h - 1) makePlot(t, lastPlotCrop(), false, b.id); else S.floor[t] = FLOOR.PATH;
    }
  }
  rebuildOcc();
  S.stats.built = (S.stats.built || 0) + 1;
  emit({ t: 'built', b: b.id, type, who });
}
function cancelSite(b) {
  const type = b.of;
  releaseBuilders(b, false);
  S.buildings = S.buildings.filter(o => o !== b);
  if (BUILDINGS[type].found) S.found[type] = (S.found[type] || 0) + 1; else S.coins += b.con.paid || 0;
  if (S.built[type]) S.built[type]--;
  rebuildOcc();
  return true;
}
function tickSites(dt) {
  for (const k in SITE_N) delete SITE_N[k];
  const at = {};
  for (const m of S.meeples) if (m.task && m.task.type === 'construct') { SITE_N[m.task.b] = (SITE_N[m.task.b] || 0) + 1; if (!m.path.length) at[m.task.b] = 1; }
  let n = 0;
  for (const b of S.buildings) if (b.of) {
    if (siteWaiting(b)) continue;
    n++;
    // nobody can get to it (walled in, or everyone is fishing): it slowly finishes itself
    if (at[b.id]) b.con.idle = 0;
    else if ((b.con.idle = (b.con.idle || 0) + dt) > 25) { b.con.p += dt * 0.6; if (b.con.p >= b.con.need) { finishSite(b); break; } }
  }
  SITES_OPEN = n;
}
function pickBuild(m) {
  let best = null, bd = 1e9;
  for (const b of S.buildings) if (b.of && !siteWaiting(b) && (SITE_N[b.id] || 0) < siteCap(b)) {
    const d = Math.abs(b.x * T - m.x) + Math.abs(b.y * T - m.y); if (d < bd) { bd = d; best = b; }
  }
  if (!best) return false;
  const acc = accessTiles(best).filter(walkable); if (!acc.length) return false;
  // spread out around the site: take the least crowded side
  const cnt = {};
  for (const o of S.meeples) if (o.task && o.task.type === 'construct' && o.task.b === best.id) cnt[o.task.spot] = (cnt[o.task.spot] || 0) + 1;
  const dist = i => Math.abs((i % MW) * T - m.x) + Math.abs(((i / MW) | 0) * T - m.y);
  acc.sort((a, c) => (cnt[a] || 0) - (cnt[c] || 0) || dist(a) - dist(c));
  for (const spot of acc.slice(0, 3)) {
    if (goTo(m, new Set([spot]))) {
      m.task = { type: 'construct', b: best.id, spot, sw: Math.random() * 0.4, ox: (Math.random() - 0.5) * 22, oy: (Math.random() - 0.5) * 14 };
      SITE_N[best.id] = (SITE_N[best.id] || 0) + 1;
      return true;
    }
  }
  return false;
}

// ---------------------------------------------------------------- quiet moments: benches, lanterns, fountains
let WORK_WAITING = false;
const isNight = () => Math.sin((S.day - 0.25) * Math.PI * 2) < -0.05;
function idleMoment(m, s) {
  if (Math.random() < 0.4) return false;
  const night = isNight();
  let best = null, bd = 7 * T, kind = '';
  for (const b of S.buildings) {
    const k = b.type === 'bench' ? 'sit' : b.type === 'lantern' && night ? 'lamp' : (b.type === 'fountain' || b.type === 'birdbath') && !night ? 'gaze' : '';
    if (!k) continue;
    const d = Math.abs((b.x + 0.5) * T - m.x) + Math.abs((b.y + 0.5) * T - m.y);
    if (d >= bd) continue;
    const there = S.meeples.filter(o => o.task && o.task.type === 'rest' && o.task.b === b.id).length;
    if (there >= (k === 'sit' ? 1 : 4)) continue;
    bd = d; best = b; kind = k;
  }
  if (!best || !goTo(m, accessOfB(best))) return false;
  const t = 5 + Math.random() * 6;
  m.task = { type: 'rest', b: best.id, kind, t, max: t };
  return true;
}
function arrive4(m, t, dt) {
  const b = BMAP[t.b];
  if (t.type === 'construct') {
    if (!b || !b.of || siteWaiting(b)) { m.task = null; m.act = 0; return; }
    const d = BUILDINGS[b.type], w = mWork(m);
    m.face = (b.x + d.w / 2) * T >= m.x ? 1 : -1;
    // shuffle to their own spot on the tile so a crowd of builders doesn't stand in one pile
    const tx = (t.spot % MW) * T + T / 2 + t.ox, ty = ((t.spot / MW) | 0) * T + T / 2 + t.oy;
    m.x += (tx - m.x) * Math.min(1, dt * 5); m.y += (ty - m.y) * Math.min(1, dt * 5);
    m.act += dt * w; b.con.p += dt * w; b.con.idle = 0;
    if (b.con.req) b.con.p = Math.min(b.con.p, b.con.need * b.con.stage / 4);
    mRec(m, 'b', dt);
    if ((t.sw -= dt * w) <= 0) { t.sw = 0.46 + Math.random() * 0.1; emit({ t: 'hammer', b: b.id, x: m.x, y: m.y, face: m.face, dig: b.con.p < b.con.need * BUILD_FOUND }); }
    if (b.con.p >= b.con.need) finishSite(b);
    return;
  }
  // resting
  t.t -= dt;
  if (!b || t.t <= 0 || (WORK_WAITING && t.max - t.t > 2.5)) { m.task = null; m.act = 0; m.wait = 0.3; return; }
  if (t.kind === 'sit') { const k = Math.min(1, dt * 4); m.x += ((b.x + 0.5) * T - m.x) * k; m.y += (b.y * T + 44 - m.y) * k; }
  else m.face = (b.x + 0.5) * T >= m.x ? 1 : -1;
  if (Math.random() < dt * 0.22) emote(m, t.kind === 'lamp' ? (Math.random() < 0.5 ? 'note' : 'zzz') : Math.random() < 0.5 ? 'heart' : 'note');
}

// ---------------------------------------------------------------- each Meeple's own record
const BADGES = [
  { id: 'h1', k: 'h', n: 100,   name: 'Green Thumb',     icon: '🌱', how: 'Harvest 100 crops' },
  { id: 'h2', k: 'h', n: 1000,  name: 'Master Gardener', icon: '🌿', how: 'Harvest 1,000 crops' },
  { id: 'h3', k: 'h', n: 10000, name: 'Harvest Legend',  icon: '🏆', how: 'Harvest 10,000 crops' },
  { id: 'w1', k: 'w', n: 5000,  name: 'Wanderer',        icon: '🥾', how: 'Walk 5,000 tiles' },
  { id: 'w2', k: 'w', n: 100000, name: 'Trailblazer',    icon: '🧭', how: 'Walk 100,000 tiles' },
  { id: 'b1', k: 'b', n: 60,    name: 'Handy',           icon: '🔨', how: 'Spend a minute building' },
  { id: 'b2', k: 'b', n: 900,   name: 'Master Builder',  icon: '🏗', how: 'Spend 15 minutes building' },
  { id: 'f1', k: 'f', n: 25,    name: 'Angler',          icon: '🎣', how: 'Catch 25 fish' },
  { id: 'f2', k: 'f', n: 300,   name: 'Old Salt',        icon: '⚓', how: 'Catch 300 fish' },
];
const recOf = (m, k) => k === 'w' ? Math.floor((m.walked || 0) / T) : (m.rec && m.rec[k]) || 0;
const badgesOf = m => BADGES.filter(b => recOf(m, b.k) >= b.n);
function mRec(m, k, n, crop) {
  const r = m.rec || (m.rec = { h: 0, f: 0, b: 0 });
  const before = r[k] || 0; r[k] = before + n;
  if (crop) { const by = m.by || (m.by = {}); by[crop] = (by[crop] || 0) + n; }
  for (const bd of BADGES) if (bd.k === k && before < bd.n && r[k] >= bd.n) emit({ t: 'badge', m: m.id, id: bd.id });
}
function favCrop(m) {
  let best = null, bn = 0;
  for (const k in m.by || {}) if (m.by[k] > bn) { bn = m.by[k]; best = k; }
  return best;
}
const _mk4 = makeMeeple;
makeMeeple = function (crop, x, y) { const m = _mk4(crop, x, y); m.born = S ? S.playTime : 0; m.rec = { h: 0, f: 0, b: 0 }; return m; };
Object.assign(HAT_RULES, { laurel: () => S.meeples.some(m => m.rec && m.rec.h >= 1000) });

// ---------------------------------------------------------------- crop mastery
// stars at 100 / 1,000 / 10,000 banked; each star makes that crop grow a little faster and sell for a little more
const MASTERY = [100, 1000, 10000], MASTERY_SELL = 0.05, MASTERY_GROW = 0.04, MASTERY_NAME = ['', 'Bronze', 'Silver', 'Gold'];
function masteryStars(id) {
  const c = CROP[id]; if (!c || c.flower || !S) return 0;
  const n = S.lifetime[id] || 0;
  return n >= MASTERY[2] ? 3 : n >= MASTERY[1] ? 2 : n >= MASTERY[0] ? 1 : 0;
}
function checkMastery() {
  for (const c of CROPS) {
    const st = masteryStars(c.id);
    if (st > (S.mast[c.id] || 0)) { S.mast[c.id] = st; emit({ t: 'mastery', id: c.id, stars: st }); }
  }
}

// ---------------------------------------------------------------- Pip's requests
// A scripted run of small jobs that walks a new player through the first hour, then endless little wishes.
const QUEST_LINE = [
  { k: 'bank', a: 'carrot', n: 3, r: 80, tx: `Hi, I'm <b>Pip</b>! Watch me pull up these carrots and carry them to the storehouse.` },
  { k: 'sell', n: 5, r: 170, tool: 'coins', tx: `Tap the <b>coins</b> up top and sell 5 carrots at the Market.` },
  { k: 'build', a: 'creator', n: 1, ri: ['carrot', 8], tool: 'build', tx: `Open <b>Build → Homestead</b> and place a <b>Meeple Creator</b>. I'll build it myself, piece by piece!` },
  { k: 'made', n: 1, r: 60, tx: `Tap the <b>Meeple Creator</b> and turn 8 carrots into a brand-new Meeple!` },
  { k: 'plots', n: 12, r: 60, tool: 'build', tx: `More hands, more carrots! <b>Build → Farm</b>: add 3 more Garden Plots.` },
  { k: 'clear', n: 3, r: 60, tool: 'clear', tx: `Tap <b>Clear</b> and cut back 3 brambles or trees to make room.` },
  { k: 'level', n: 1, r: 80, tx: `Bank 25 carrots and we'll unlock <b>Wheat</b>.` },
  { k: 'plant', a: 'wheat', n: 4, r: 60, tool: 'crops', tx: `Tap <b>Crops</b>, pick Wheat, then tap 4 plots to plant it.` },
  { k: 'build', a: 'mill', n: 1, r: 120, tool: 'build', tx: `Build a <b>Windmill</b> (Build → Crafting) to grind wheat into flour.` },
  { k: 'bank', a: 'flour', n: 5, r: 120, tx: `Tap the Windmill, choose <b>Flour</b>, and bank 5 bags.` },
  { k: 'meeples', n: 4, r: 150, tx: `Let's be a team of 4! Make more Meeples at the Creator.` },
  { k: 'build', a: 'well', n: 1, r: 100, tool: 'build', tx: `Build a <b>Stone Well</b> (Build → Farm). Watered crops grow 60% faster.` },
  { k: 'build', a: 'noticeboard', n: 1, r: 100, tool: 'build', tx: `Build an <b>Orders Board</b> (Build → Homestead) so the neighbours can ask for things.` },
  { k: 'orders', n: 1, r: 200, tx: `Deliver an order from the <b>Orders Board</b>. They pay far more than the market.` },
  { k: 'build', a: 'compost', n: 1, r: 120, tool: 'build', tx: `A <b>Compost Bin</b> (Build → Farm) turns spent plants into fertilizer.` },
  { k: 'level', n: 3, r: 250, tx: `Keep banking what the goal bar asks for until we reach <b>level 4</b>.` },
];
const fishTotal = () => FISH.reduce((a, f) => a + (S.lifetime[f.id] || 0), 0);
const farmPlots = () => { let n = 0; for (const k in S.plots) if (!S.plots[k].gh) n++; return n; };
function questRaw(q) {
  switch (q.k) {
    case 'bank': return S.lifetime[q.a] || 0;
    case 'sell': return S.stats.sold;
    case 'clear': return S.stats.cleared;
    case 'orders': return S.stats.orders;
    case 'craft': return S.stats.crafted;
    case 'fish': return fishTotal();
    case 'made': return S.stats.made;
    case 'plots': return farmPlots();
    case 'meeples': return S.meeples.length;
    case 'build': return bReady(q.a);
    case 'plant': { let n = 0; for (const k in S.plots) if (S.plots[k].crop === q.a) n++; return n; }
    case 'level': return S.level;
  }
  return 0;
}
const QUEST_REL = { bank: 1, sell: 1, clear: 1, orders: 1, craft: 1, fish: 1, made: 1 };
const questHave = q => Math.max(0, Math.min(q.n, questRaw(q) - (q.base || 0)));
const questFrac = q => q.k === 'level' && q.n === 1 ? (S.level >= 1 ? 1 : Math.min(0.99, (S.lifetime.carrot || 0) / 25)) : questHave(q) / q.n;
const questDone = q => q.k === 'level' ? S.level >= q.n : questRaw(q) - (q.base || 0) >= q.n;
function questText(Q) {
  if (Q.i < QUEST_LINE.length) return QUEST_LINE[Q.i].tx;
  const q = Q.q, nm = q.a && ITEM[q.a] ? ITEM[q.a].name.toLowerCase() : '';
  switch (q.k) {
    case 'bank': return `Could we bank <b>${q.n} ${nm}</b>? I've got plans for it.`;
    case 'sell': return `The market's busy today. Let's sell <b>${q.n} things</b>.`;
    case 'clear': return `I'd love more room. Clear <b>${q.n} more tiles</b> of woodland.`;
    case 'orders': return `Somebody's waiting on us. Deliver <b>${q.n > 1 ? q.n + ' orders' : 'an order'}</b> from the board.`;
    case 'craft': return `Keep the workshops humming: craft <b>${q.n} goods</b>.`;
    case 'fish': return `Fancy fish for supper? Catch <b>${q.n} fish</b>.`;
    case 'made': return `We could use another pair of hands. Make <b>a new Meeple</b>.`;
    case 'plots': return `Let's grow the garden to <b>${q.n} plots</b>.`;
  }
  return '';
}
function nextQuest() {
  const Q = S.quest; Q.i++; Q.ready = false;
  const def = Q.i < QUEST_LINE.length ? QUEST_LINE[Q.i] : newWish();
  const q = { k: def.k, n: def.n }; if (def.a) q.a = def.a; if (def.r) q.r = def.r; if (def.ri) q.ri = def.ri; if (def.tool) q.tool = def.tool;
  if (QUEST_REL[q.k] && Q.i >= QUEST_LINE.length) q.base = questRaw(q);   // the scripted line counts from the very start
  Q.q = q; Q.lastK = q.k;
}
function newWish() {
  const P = Math.max(9, farmPlots()), crops = LEVELS.slice(0, S.level + 1).map(l => l.crop).filter(Boolean).slice(-3);
  const W = Math.max(60, Math.round(sellPrice(crops[crops.length - 1]) * P * 1.5));
  const opts = [];
  for (const c of crops) opts.push([{ k: 'bank', a: c, n: clampN(P * 140 / CROP[c].grow, 5, 150), r: W }, 2]);
  let cheap = 0; for (let i = 0; i < MW * MH; i++) if (canClear(i)) { const c = clearCost(i); if (!cheap || c < cheap) cheap = c; }
  if (cheap) opts.push([{ k: 'clear', n: 3 + ((Math.random() * 3) | 0), r: Math.max(W, Math.round(cheap * 3)) }, 2]);
  if (hasBoard()) opts.push([{ k: 'orders', n: 1, r: W * 2 }, 2]);
  if (S.buildings.some(b => BUILDINGS[b.type].proc && b.recipe)) opts.push([{ k: 'craft', n: 4 + ((Math.random() * 6) | 0), r: Math.round(W * 1.5) }, 3]);
  if (S.meeples.some(m => m.fish) && bReady('dock')) opts.push([{ k: 'fish', n: 3 + ((Math.random() * 4) | 0), r: W }, 1.5]);
  if (madeCount() < MEEPLE_MAX && bReady('creator')) opts.push([{ k: 'made', n: 1, r: Math.round(W * 1.5) }, 1.5]);
  opts.push([{ k: 'plots', n: farmPlots() + 2, r: Math.max(W, bCost('plot') * 3) }, 1.5]);
  opts.push([{ k: 'sell', n: clampN(P * 2, 10, 200), r: W }, 1]);
  const fresh = opts.filter(o => o[0].k !== S.quest.lastK);
  const q = pickW(fresh.length ? fresh : opts);
  if (Math.random() < 0.2) q.ri = bUnlocked('compost') && Math.random() < 0.6 ? ['fertilizer', 4 + ((Math.random() * 5) | 0)] : ['_decor', FOUND_DECOR[(Math.random() * FOUND_DECOR.length) | 0]];
  return q;
}
function giveReward(r, ri) {
  if (r) { S.coins += r; S.stats.earned += r; }
  if (ri) { if (ri[0] === '_decor') S.found[ri[1]] = (S.found[ri[1]] || 0) + 1; else invAdd(ri[0], ri[1], false); }
}
function rewardLabel(r, ri) {
  const parts = [];
  if (r) parts.push(fmt(r) + ' coins');
  if (ri) parts.push(ri[0] === '_decor' ? 'a ' + BUILDINGS[ri[1]].name : ri[1] + ' ' + ITEM[ri[0]].name.toLowerCase() + (ri[1] > 1 && !/s$/.test(ITEM[ri[0]].name) ? 's' : ''));
  return parts.join(' + ');
}
function claimQuest() {
  const Q = S.quest; if (!Q || !Q.q || !questDone(Q.q)) return false;
  const q = Q.q;
  giveReward(q.r, q.ri);
  S.stats.quests = (S.stats.quests || 0) + 1;
  emit({ t: 'quest', r: q.r || 0, ri: q.ri || null });
  nextQuest();
  return true;
}

// ---------------------------------------------------------------- the daily visitor
// Once per real day a traveller stops by with a gift and one special request. Missing a day costs nothing.
const VISITORS = ['Marigold the peddler', 'Old Tobias and his cart', 'Wren the tinker', 'Hazel the seed-seller', 'Barnaby the wanderer', 'Juniper the trader'];
function dayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function newVisitor() {
  const crops = LEVELS.slice(0, S.level + 1).map(l => l.crop).filter(Boolean);
  // worth a few minutes of the farm's income (capped, so early request rewards don't inflate it)
  const base = sellPrice(crops[crops.length - 1]) * Math.max(9, farmPlots());
  const W = Math.max(80, base * 2, Math.min(base * 8, Math.round(earnRate(1800) / 8)));
  const hats = FIND_HATS.filter(h => !S.hats.includes(h));
  const gift = pickW([[{ k: 'coins', n: W }, 4], [{ k: 'fert', n: 8 }, bUnlocked('compost') ? 2 : 0], [{ k: 'decor', id: FOUND_DECOR[(Math.random() * FOUND_DECOR.length) | 0] }, 2],
    [{ k: 'seed', id: TREES[(Math.random() * TREES.length) | 0].seed }, bUnlocked('oaktree') ? 2 : 0], [{ k: 'hat', id: hats[(Math.random() * hats.length) | 0] }, hats.length ? 1 : 0]]);
  const pool = orderPool(), pick = pool.length ? pickW(pool.map(p => [p, p.w])) : { id: 'carrot', q: 10 };
  const n = Math.max(2, Math.round(pick.q * 1.6));
  return { day: dayKey(), who: (Math.random() * VISITORS.length) | 0, gift, got: false, req: { [pick.id]: n }, reward: Math.max(W, Math.round(sellPrice(pick.id) * n * 4)), done: false };
}
const visitorHere = () => !!S.visitor && S.visitor.day === dayKey();
const visitorBusy = () => visitorHere() && (!S.visitor.got || !S.visitor.done);
function giftText(g) {
  if (g.k === 'coins') return fmt(g.n) + ' coins';
  if (g.k === 'fert') return g.n + ' fertilizer';
  if (g.k === 'decor') return 'a ' + BUILDINGS[g.id].name;
  if (g.k === 'seed') return 'a ' + ITEM[g.id].name.toLowerCase();
  if (g.k === 'hat') return 'a ' + HATS.find(h => h.id === g.id).name;
  return '';
}
function takeGift() {
