<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f5a2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meeple Meadows">
<script>if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });</script>
<title>Meeple Meadows</title>
<style>
:root{
  --ink:#3d2a1f; --ink2:#6a4a32; --paper:#fbf3df; --paper2:#f4e4bc; --paper3:#ead6a6;
  --wood:#8a5a32; --wood2:#b07a42; --green:#5aa335; --green2:#3f7f25; --red:#d8463a; --gold:#f2c23a;
  --blue:#4f7fb8; --shadow:rgba(40,25,10,.35);
  --font:"Nunito","Varela Round","Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
}
html{font-size:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#284a2a;font-family:var(--font);color:var(--ink);touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;top:0;right:0;bottom:0;left:0;display:block;touch-action:none}
.ico{width:1.6rem;height:1.6rem;vertical-align:middle;object-fit:contain;pointer-events:none}
.ico.sm{width:1.2rem;height:1.2rem}.ico.lg{width:2.4rem;height:2.4rem}.ico.xl{width:3.4rem;height:3.4rem}
.hidden{display:none!important}

/* ---------- buttons */
.btn{font:inherit;font-weight:800;color:var(--ink);border:2px solid var(--ink);border-radius:.8rem;padding:.45rem .9rem;
  background:linear-gradient(#fffaf0,#f1dfb4);box-shadow:0 .22rem 0 var(--ink),0 .35rem .6rem var(--shadow);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;font-size:.95rem;line-height:1.1;position:relative;top:0;transition:top .05s,box-shadow .05s}
.btn:active{top:.18rem;box-shadow:0 .04rem 0 var(--ink),0 .1rem .3rem var(--shadow)}
.btn.green{background:linear-gradient(#8fd06a,#4f9a30);color:#fff;text-shadow:0 1px 0 #2a5a18}
.btn.red{background:linear-gradient(#f08070,#c8382a);color:#fff;text-shadow:0 1px 0 #6a1a10}
.btn.gold{background:linear-gradient(#ffe48a,#e8aa2a)}
.btn.blue{background:linear-gradient(#9ac4f0,#4f7fb8);color:#fff;text-shadow:0 1px 0 #1a3a6a}
.btn.sm{padding:.28rem .55rem;font-size:.8rem;border-radius:.6rem}
.btn.on{background:linear-gradient(#8fd06a,#4f9a30);color:#fff}
.btn[disabled],.btn.dis{filter:grayscale(.7) brightness(.92);opacity:.6;pointer-events:none}
.btn.wide{width:100%}

/* ---------- title */
#title{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;
  background:radial-gradient(ellipse at center,rgba(255,240,200,.0) 30%,rgba(30,20,10,.45) 100%)}
.logo{text-align:center;margin-bottom:1.6rem;animation:float 4s ease-in-out infinite}
.logo h1{margin:0;font-size:clamp(2.6rem,8vw,5.2rem);font-weight:900;letter-spacing:.02em;color:#fff6dc;line-height:.95;
  -webkit-text-stroke:.12em var(--ink);paint-order:stroke fill;text-shadow:0 .08em 0 var(--ink),0 .18em .4em rgba(0,0,0,.4)}
.logo h1 span{color:#ffd06a}
.logo .sub{display:inline-block;margin-top:.7rem;background:var(--paper);border:2px solid var(--ink);border-radius:2rem;padding:.25rem 1rem;font-weight:800;color:var(--ink2);box-shadow:0 .2rem 0 var(--ink)}
.logo .meeples{display:flex;justify-content:center;gap:.3rem;margin-bottom:.4rem}
.logo .meeples img{width:2.6rem;height:2.6rem;animation:hop 1.2s ease-in-out infinite}
.logo .meeples img:nth-child(2){animation-delay:.15s}.logo .meeples img:nth-child(3){animation-delay:.3s}.logo .meeples img:nth-child(4){animation-delay:.45s}.logo .meeples img:nth-child(5){animation-delay:.6s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-.6rem)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-.4rem) rotate(1deg)}}
.menu{display:flex;flex-direction:column;gap:.8rem;min-width:16rem}
.menu .btn{font-size:1.15rem;padding:.7rem 1.2rem}
.ver{position:fixed;bottom:.5rem;right:.8rem;color:#fff6dc;opacity:.7;font-size:.75rem;font-weight:700;z-index:31}

/* ---------- hud */
#hud{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
.topbar{position:absolute;top:calc(.5rem + env(safe-area-inset-top));left:calc(.5rem + env(safe-area-inset-left));right:calc(.5rem + env(safe-area-inset-right));display:flex;gap:.5rem;align-items:flex-start;pointer-events:none}
.topbar > *{pointer-events:auto}
.pill{display:flex;align-items:center;gap:.35rem;background:var(--paper);border:2px solid var(--ink);border-radius:2rem;padding:.2rem .7rem .2rem .25rem;
  font-weight:900;font-size:1.05rem;box-shadow:0 .2rem 0 var(--ink),0 .3rem .6rem var(--shadow);white-space:nowrap}
.pill .ico{width:1.8rem;height:1.8rem}
.pill.coins{min-width:7.5rem}
.goal{flex:1;max-width:30rem;margin:0 auto;background:var(--paper);border:2px solid var(--ink);border-radius:1rem;padding:.3rem .6rem;box-shadow:0 .2rem 0 var(--ink),0 .3rem .6rem var(--shadow);cursor:pointer}
.goal .gt{display:flex;align-items:center;gap:.4rem;font-weight:900;font-size:.9rem}
.goal .gt .ico{width:1.5rem;height:1.5rem}
.goal .reqs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.15rem}
/* with a panel open the goal keeps to one line, so the two never overlap */
.panel-open .goal .reqs{display:none}
.req{display:flex;align-items:center;gap:.2rem;font-size:.75rem;font-weight:800;flex:1;min-width:5.5rem}
.req .ico{width:1.1rem;height:1.1rem}
.bar{height:.5rem;background:#d8c49a;border:1.5px solid var(--ink);border-radius:1rem;overflow:hidden;flex:1}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(#9ad870,#4f9a30);border-radius:1rem;transition:width .3s}
.bar.gold > i{background:linear-gradient(#ffe48a,#e8aa2a)}
.bar.big{height:.8rem}
.iconbtn{width:3rem;height:3rem;border-radius:1rem;padding:0}
.iconbtn .ico{width:2rem;height:2rem}
.toolbar{position:absolute;bottom:calc(.6rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:.45rem;padding:.4rem .5rem;
  background:linear-gradient(#a8743e,#7a4f2a);border:2px solid var(--ink);border-radius:1.2rem;box-shadow:0 .25rem 0 var(--ink),0 .5rem 1rem var(--shadow)}
.tool{display:flex;flex-direction:column;align-items:center;gap:.05rem;width:4.4rem;padding:.3rem .1rem .25rem;font-size:.72rem;font-weight:900}
.tool .ico{width:2.1rem;height:2.1rem}
.tool .badge{position:absolute;top:-.4rem;right:-.3rem;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:1rem;font-size:.7rem;padding:0 .35rem;min-width:1.3rem}
.modebar{position:absolute;bottom:calc(6.3rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.6rem;
  background:var(--paper);border:2px solid var(--ink);border-radius:1rem;padding:.4rem .5rem .4rem .8rem;font-weight:800;box-shadow:0 .2rem 0 var(--ink),0 .4rem .8rem var(--shadow);white-space:nowrap}
.hint{position:absolute;left:calc(.6rem + env(safe-area-inset-left));bottom:calc(6.4rem + env(safe-area-inset-bottom));max-width:19rem;background:var(--paper);border:2px solid var(--ink);border-radius:1rem;
  padding:.55rem .7rem .55rem 3rem;font-size:.85rem;font-weight:700;box-shadow:0 .2rem 0 var(--ink),0 .4rem .8rem var(--shadow);line-height:1.3}
.hint img.who{position:absolute;left:.3rem;top:.4rem;width:2.4rem;height:2.4rem}
.hint .x{position:absolute;right:.2rem;top:.05rem;font-weight:900;padding:.2rem .4rem;cursor:pointer;opacity:.6}
.alerts{position:absolute;top:calc(4.4rem + env(safe-area-inset-top));left:calc(.5rem + env(safe-area-inset-left));display:flex;flex-direction:column;gap:.4rem;align-items:flex-start}
.pill.alert{font-size:.85rem;padding:.15rem .6rem .15rem .2rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.pill.alert .ico{width:1.5rem;height:1.5rem}
.pill.alert.good{background:#dff3c8}
.pill.alert.bad{background:#ffe0d6;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,88%,100%{transform:none}92%{transform:rotate(-4deg)}96%{transform:rotate(4deg)}}
.warnbox{margin-top:.5rem;padding:.45rem .55rem;background:#fff0e8;border:2px solid #c8302a;border-radius:.8rem}
.warnbox .t{display:flex;align-items:center;gap:.3rem;color:#a8281e}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.tile{background:#fff8e8;border:2px solid var(--ink);border-radius:.8rem;padding:.35rem .5rem}
.tile b{display:block;font-size:1.25rem;font-weight:900}
.chartbox{background:#fffaf0;border:2px solid var(--ink);border-radius:.8rem;padding:.3rem}
.chartbox canvas{display:block;width:100%;height:11rem;touch-action:none}
.hbar{display:flex;align-items:center;gap:.35rem;margin:.22rem 0;font-size:.8rem;font-weight:800}
.hbar .ico{width:1.3rem;height:1.3rem}
.hbar .nm{width:7.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .trk{flex:1;height:.7rem;border-radius:.2rem}
.hbar .trk i{display:block;height:100%;background:#e8aa2a;border-radius:0 .25rem .25rem 0}
.hbar .v{width:3.6rem;text-align:right}
input.txt{font:inherit;font-size:1.2rem;font-weight:800;width:100%;max-width:18rem;padding:.5rem .7rem;border:2px solid var(--ink);border-radius:.7rem;background:#fffaf0;color:var(--ink);margin:.4rem 0}
#fps{position:absolute;left:.5rem;bottom:.3rem;color:#fff;font:700 .75rem monospace;text-shadow:0 1px 2px #000;pointer-events:none}

/* ---------- panels */
#panel{position:fixed;top:calc(4.6rem + env(safe-area-inset-top));right:calc(.6rem + env(safe-area-inset-right));bottom:calc(6.6rem + env(safe-area-inset-bottom));width:min(27rem,94vw);z-index:20;
  display:flex;flex-direction:column;background:var(--paper);border:2.5px solid var(--ink);border-radius:1.2rem;box-shadow:0 .3rem 0 var(--ink),0 .8rem 1.6rem var(--shadow);
  animation:slidein .18s ease-out}
#panel::before{content:"";position:absolute;top:.35rem;right:.35rem;bottom:.35rem;left:.35rem;border:1.5px dashed rgba(106,74,50,.45);border-radius:.9rem;pointer-events:none}
@keyframes slidein{from{transform:translateX(1.5rem);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;gap:.5rem;padding:.7rem .8rem .5rem;border-bottom:2px solid rgba(61,42,31,.15)}
.ph h2{margin:0;font-size:1.25rem;font-weight:900;flex:1;line-height:1.1}
.ph h2 small{display:block;font-size:.75rem;font-weight:700;color:var(--ink2)}
.ph .ico{width:2.4rem;height:2.4rem}
.close{width:2.3rem;height:2.3rem;border-radius:50%;padding:0;font-size:1.2rem}
.pb{flex:1;overflow-y:auto;padding:.6rem .8rem .9rem;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:.3rem;padding:.4rem .8rem 0;flex-wrap:wrap}
.tab{font-size:.8rem;padding:.3rem .6rem}
.card{background:#fffaf0;border:2px solid var(--ink);border-radius:.9rem;padding:.55rem .6rem;margin-bottom:.55rem;box-shadow:0 .15rem 0 rgba(61,42,31,.6)}
.card.locked{opacity:.55;background:#efe4cc}
.card.sel{background:#eaf7d8;border-color:var(--green2);box-shadow:0 .15rem 0 var(--green2)}
.row{display:flex;align-items:center;gap:.5rem}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.t{font-weight:900;font-size:.98rem}
.s{font-size:.78rem;color:var(--ink2);font-weight:700;line-height:1.25}
.n{font-weight:900;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:.15rem;background:#f4e4bc;border:1.5px solid rgba(61,42,31,.5);border-radius:1rem;padding:.05rem .4rem .05rem .1rem;font-size:.78rem;font-weight:900;margin:.1rem .1rem 0 0}
.chip.bad{background:#f8d0c8;border-color:#b03a2a}
.chip.ok{background:#d8f0c0;border-color:#3f7f25}
.arrow{font-weight:900;color:var(--ink2);margin:0 .15rem}
.cost{display:inline-flex;align-items:center;gap:.15rem;font-weight:900}
.cost.no{color:#b03a2a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.45rem}
.cell{background:#fffaf0;border:2px solid var(--ink);border-radius:.8rem;padding:.3rem .2rem;text-align:center;font-size:.72rem;font-weight:800;box-shadow:0 .12rem 0 rgba(61,42,31,.6);position:relative;cursor:pointer}
.cell .ico{width:2.3rem;height:2.3rem;display:block;margin:0 auto}
.cell .q{position:absolute;top:.1rem;right:.3rem;font-weight:900;font-size:.8rem}
.cell.sel{background:#eaf7d8;border-color:var(--green2)}
.cell.locked{opacity:.4}
.sec{font-weight:900;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:.7rem 0 .35rem;display:flex;align-items:center;gap:.4rem}
.sec::after{content:"";flex:1;border-top:2px dotted rgba(106,74,50,.4)}
.stat{display:flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:800;margin:.12rem 0}
.stat b{width:3.6rem}
.statbar{flex:1;height:.45rem;background:#e2d2ae;border-radius:1rem;overflow:hidden;border:1px solid rgba(61,42,31,.4)}
.statbar i{display:block;height:100%;background:var(--green)}
.bimg{width:4.2rem;height:4.2rem;object-fit:contain;flex:none}
.swatch{width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid var(--ink);display:inline-block;vertical-align:middle}
.chain{display:flex;align-items:center;flex-wrap:wrap;gap:.1rem;font-size:.75rem;font-weight:800;margin:.25rem 0}
.chain .st{display:inline-flex;flex-direction:column;align-items:center;min-width:2.6rem}
.chain .st .ico{width:1.7rem;height:1.7rem}
.chain .via{font-size:.62rem;color:var(--ink2);display:flex;flex-direction:column;align-items:center;margin:0 .1rem}
.toggle{display:inline-flex;border:2px solid var(--ink);border-radius:.7rem;overflow:hidden}
.toggle button{font:inherit;font-weight:800;font-size:.8rem;border:0;padding:.3rem .6rem;background:#f4e4bc;color:var(--ink)}
.toggle button.on{background:var(--green);color:#fff}
.toggle button+button{border-left:2px solid var(--ink)}
input[type=range]{width:100%;accent-color:var(--green);height:1.6rem}
.setrow{display:flex;align-items:center;gap:.6rem;margin:.55rem 0;font-weight:800}
.setrow > span:first-child{width:7.5rem;flex:none}
.p{font-size:.88rem;line-height:1.45;font-weight:600}
.p b{font-weight:900}

/* ---------- popups & toasts */
#pop{position:fixed;z-index:25;background:var(--paper);border:2px solid var(--ink);border-radius:1rem;padding:.5rem .6rem;box-shadow:0 .2rem 0 var(--ink),0 .5rem 1rem var(--shadow);min-width:11rem;transform:translate(-50%,-110%)}
#pop::after{content:"";position:absolute;left:50%;bottom:-.55rem;width:.9rem;height:.9rem;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
#toasts{position:fixed;top:calc(5rem + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
.toast{background:var(--paper);border:2px solid var(--ink);border-radius:2rem;padding:.35rem .9rem .35rem .4rem;font-weight:800;display:flex;align-items:center;gap:.4rem;box-shadow:0 .2rem 0 var(--ink),0 .4rem .8rem var(--shadow);animation:toastin .25s ease-out}
.toast.bad{background:#fbe0d8}
@keyframes toastin{from{transform:translateY(-.8rem) scale(.9);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(30,20,10,.55);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:1.4rem;padding:1.2rem 1.4rem;max-width:min(34rem,92vw);max-height:88vh;overflow:auto;box-shadow:0 .35rem 0 var(--ink),0 1rem 2rem rgba(0,0,0,.4);text-align:center;touch-action:pan-y}
.mbox::before{content:"";position:absolute;top:.4rem;right:.4rem;bottom:.4rem;left:.4rem;border:1.5px dashed rgba(106,74,50,.45);border-radius:1rem;pointer-events:none}
.mbox h2{margin:.2rem 0 .6rem;font-size:1.6rem;font-weight:900}
.mbox .btns{display:flex;gap:.6rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.burst{animation:burst 1s ease-out}
@keyframes burst{0%{transform:scale(.3) rotate(-20deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1)}}
.slot{display:flex;align-items:center;gap:.7rem;text-align:left}
.loading{flex-direction:column;text-align:center;padding:1.5rem;position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;background:#2f5a2c;color:#fff6dc;font-weight:900;font-size:1.4rem;z-index:100}

.seasonpill{line-height:1.05;font-size:.9rem;padding:.2rem .7rem .2rem .35rem;cursor:pointer}
.seasonpill small{font-size:.68rem;font-weight:800;color:var(--ink2)}
.semoji{font-size:1.5rem;line-height:1}
.sdots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:.15rem}
.sdots i{width:.5rem;height:.5rem;border-radius:50%;border:1px solid rgba(61,42,31,.55);display:inline-block}
.cell .sdots{display:flex;justify-content:center;margin:.1rem 0 0}
.cell .hv{font-size:.66rem;font-weight:900;color:#3f7f25}
.cell.off{opacity:.45;filter:saturate(.4)}
.seatabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.seatabs .btn{flex-direction:column;padding:.3rem .2rem;font-size:.75rem}
.seatabs small{font-size:.6rem}
.ptab-ic{display:block;min-height:1.2rem}
/* tablets: bigger touch targets */
@media (pointer:coarse){
  .btn.sm{min-height:2.4rem;padding:.35rem .7rem}
  .toggle button{min-height:2.3rem;padding:.35rem .75rem}
  .cell{padding:.4rem .2rem}
  .close{width:2.8rem;height:2.8rem}
  .pb{padding-bottom:1.4rem}
}
@media (max-width:700px){
  html{font-size:14px}
  #panel{top:auto;left:.4rem;right:.4rem;width:auto;height:58vh;bottom:calc(6.2rem + env(safe-area-inset-bottom))}
  .tool{width:3.6rem}
  .goal .reqs{display:none}
}
@media (max-height:520px){ html{font-size:13px} }
.install{margin-top:.9rem;max-width:18rem;text-align:center;background:var(--paper);border:2px solid var(--ink);border-radius:.8rem;padding:.45rem .8rem;font-size:.82rem;font-weight:800;color:var(--ink2);box-shadow:0 .22rem 0 var(--ink)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="loading" id="loading"><span>Planting seeds…</span></div>

<div id="title" class="hidden">
  <div class="logo">
    <div class="meeples" id="logoMeeples"></div>
    <h1>Meeple<br><span>Meadows</span></h1>
    <div class="sub">a cozy little homestead</div>
  </div>
  <div class="menu" id="mainMenu"></div>
</div>
<div class="ver">v1.6.5</div>

<div id="hud" class="hidden">
  <div class="topbar">
    <div class="pill coins" id="hCoins"></div>
    <div class="pill" id="hMeeples"></div>
    <div class="goal" id="hGoal"></div>
    <button class="btn iconbtn" id="hMenu"></button>
  </div>
  <div class="alerts" id="hAlerts"></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="modebar hidden" id="modebar"></div>
  <div class="hint hidden" id="hint"></div>
  <div id="fps" class="hidden"></div>
</div>

<div id="panel" class="hidden"></div>
<div id="pop" class="hidden"></div>
<div id="toasts"></div>
<div id="modal" class="hidden"></div>

<script>
// Startup safety net, deliberately old-style JavaScript so it works on any WebView.
(function () {
  var shown = false;
  function chromeVer() { var m = /Chrome\/(\d+)/.exec(navigator.userAgent); return m ? +m[1] : 0; }
  function show(msg) {
    if (shown || window.__booted) return; shown = true;
    var el = document.getElementById('loading'); if (!el) return;
    var v = chromeVer();
    el.innerHTML = '<span>Oh no, the seeds didn\'t sprout.</span>' +
      '<div style="font-size:.9rem;font-weight:700;max-width:34rem;margin-top:1rem;line-height:1.4">' +
      (v && v < 70 ? 'Your tablet\'s <b>Android System WebView</b> is version ' + v + ', which is too old. Open the Play Store, search for <b>Android System WebView</b>, tap <b>Update</b>, then reopen the game.<br><br>' : '') +

// goods are worth a markup over their ingredients plus a little for the time they take
(function priceGoods() {
  const byOut = {}; RECIPES.forEach(r => byOut[r.out[0]] = r);
  const val = id => {
    if (ITEM[id]) return ITEM[id].price;
    const r = byOut[id];
    let v = 0; for (const k in r.in) v += val(k) * r.in[k];
    const p = Math.max(3, Math.round((v * 1.35 + r.t * 0.09) / r.out[1]));
    ITEM[id] = { id, name: GOOD[id].name, price: p, crop: false };
    return p;
  };
  GOODS.forEach(g => val(g.id));
})();

function meeplePath(g) {

    g.lineTo(s * 3, 0.4);

function plantSprite(cropId, stage) {
  const key = 'plant_' + cropId + '_' + stage;
  if (ART.sprites[key]) return ART.sprites[key];
  const crop = CROP[cropId];
  const layout = SINGLE_PLANT[cropId] ? [[0, 6]] : [[-10, -3], [10, -3], [-10, 11], [10, 11]];
  const s = makeSprite(T, T + 30, T / 2, T / 2 + 30, g => {
    layout.forEach(([x, y], i) => {
      g.save(); g.translate(x, y);
      if (stage === 0) { ell(g, 0, 0, 3.5, 1.8, '#6a4528'); ell(g, -1, -0.5, 0.7, 0.5, '#e8d8a0'); ell(g, 1.2, 0.2, 0.7, 0.5, '#e8d8a0'); }
      else if (stage === 1) { ell(g, 0, 0.5, 3, 1.4, '#6a4528'); leaf(g, 0, 0, -2.2, 5, 2, crop.leaf); leaf(g, 0, 0, -0.9, 5, 2, shade(crop.leaf, 0.15)); }

  ART.sprites[key] = s;

function bShadow() { /* shadows are drawn at runtime so the sticker edge doesn't wrap them */ }
function planks(g, x, y, w, h, col, vertical = true) {
  g.fillStyle = lgrad(g, x, y, x + w, y + h, [shade(col, 0.15), col, shade(col, -0.2)]); g.fillRect(x, y, w, h);
  g.strokeStyle = rgba(shade(col, -0.5), 0.6); g.lineWidth = 0.6;
  if (vertical) for (let i = x + 5; i < x + w; i += 5) { g.beginPath(); g.moveTo(i, y); g.lineTo(i, y + h); g.stroke(); }
  else for (let i = y + 4; i < y + h; i += 4) { g.beginPath(); g.moveTo(x, i); g.lineTo(x + w, i); g.stroke(); }
  g.strokeStyle = INK; g.lineWidth = 0.9; g.strokeRect(x, y, w, h);
}
function crate(g, x, y, s, col = '#b8844a', fruit) {
  if (fruit) for (let i = 0; i < 4; i++) blob(g, x - s * 0.3 + (i % 2) * s * 0.6, y - s - 1 - Math.floor(i / 2) * 2, s * 0.24, fruit, 0.4, -0.3);

}

  g.fillStyle = col; g.fillRect(x, y, w, h);

  for (let yy = y; yy < y + h; yy += 5) for (let xx = x + ((yy - y) / 5 % 2) * 4 - 4; xx < x + w; xx += 8) {
    const ww = Math.min(7, x + w - xx), xs = Math.max(xx, x);

  }
  g.strokeStyle = INK; g.lineWidth = 0.9; g.strokeRect(x, y, w, h);
}

// ---------------------------------------------------------------- soil
// Seamless soil textures, 96 world units square (it divides the 384-unit ground chunk, so beds
// line up across chunks). Dry earth is the default; wet earth is painted over watered plots.
const SOIL_TILE = 96;
const SOIL_CV = {};
function soilCanvas(wet) {
  const res = 2, c = newCanvas(SOIL_TILE * res, SOIL_TILE * res), g = c.getContext('2d'), N = SOIL_TILE;
  g.scale(res, res);
  const r = mulberry(wet ? 7771 : 3331);
  const P = wet
    ? { base: '#4a2e1a', lo: '#382213', hi: '#5e3c24', clod: '#583820', clodHi: '#80603f', clodLo: '#26160b', peb: '#7e786c' }
    : { base: '#8e6a44', lo: '#785636', hi: '#a68058', clod: '#977248', clodHi: '#c09a6c', clodLo: '#5a3e26', peb: '#c8bca8' };
  g.fillStyle = P.base; g.fillRect(0, 0, N, N);
  // draw at (x,y) and at the wrapped copies so the tile repeats without seams
  const wrap = (x, y, rad, fn) => {
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const X = x + dx * N, Y = y + dy * N;
      if (X + rad < 0 || Y + rad < 0 || X - rad > N || Y - rad > N) continue;
      fn(X, Y);
    }
  };
  for (let k = 0; k < 28; k++) {
    const x = r() * N, y = r() * N, rad = 8 + r() * 16, col = r() < 0.5 ? P.lo : P.hi;
    wrap(x, y, rad, (X, Y) => { const gr = g.createRadialGradient(X, Y, 0, X, Y, rad); gr.addColorStop(0, rgba(col, 0.6)); gr.addColorStop(1, rgba(col, 0)); g.fillStyle = gr; g.fillRect(X - rad, Y - rad, rad * 2, rad * 2); });
  }
  for (let k = 0; k < 1100; k++) { g.fillStyle = rgba(r() < 0.5 ? P.clodLo : P.clodHi, 0.3 + r() * 0.35); g.fillRect(r() * N, r() * N, 0.5 + r() * 0.7, 0.5 + r() * 0.5); }
  // crumbly clods, lit from the top left
  for (let k = 0; k < 85; k++) {
    const x = r() * N, y = r() * N, w = 1.2 + r() * 2.6, h = w * (0.55 + r() * 0.3), rot = (r() - 0.5) * 0.8;
    wrap(x, y, w + 2, (X, Y) => {
      g.save(); g.translate(X, Y); g.rotate(rot);
      ell(g, 0.45, 0.8, w, h, rgba(P.clodLo, 0.75)); ell(g, 0, 0, w, h, P.clod); ell(g, -w * 0.25, -h * 0.3, w * 0.55, h * 0.45, rgba(P.clodHi, wet ? 0.55 : 0.85));
      g.restore();
    });
  }
  for (let k = 0; k < 10; k++) {
    const x = r() * N, y = r() * N, w = 0.9 + r() * 1.4;
    wrap(x, y, w + 2, (X, Y) => { ell(g, X + 0.4, Y + 0.6, w, w * 0.7, 'rgba(0,0,0,0.25)'); ell(g, X, Y, w, w * 0.7, P.peb); ell(g, X - w * 0.3, Y - w * 0.25, w * 0.4, w * 0.3, 'rgba(255,255,255,0.5)'); });
  }
  if (!wet) {
    // hairline cracks in the dry crust
    g.strokeStyle = rgba('#4a3018', 0.5); g.lineWidth = 0.5;
    for (let k = 0; k < 8; k++) {
      const pts = []; let x = r() * N, y = r() * N, a = r() * 6.28;
      for (let j = 0; j < 5; j++) { pts.push([x, y]); a += (r() - 0.5) * 1.6; x += Math.cos(a) * (2 + r() * 3); y += Math.sin(a) * (2 + r() * 3); }
      wrap(pts[0][0], pts[0][1], 20, (X, Y) => { const ox = X - pts[0][0], oy = Y - pts[0][1]; g.beginPath(); pts.forEach(([px, py], j) => j ? g.lineTo(px + ox, py + oy) : g.moveTo(px + ox, py + oy)); g.stroke(); });
    }
  } else {
    // little puddles catching the sky, and glossy wet specks
    for (let k = 0; k < 5; k++) {
      const x = r() * N, y = r() * N, w = 2.5 + r() * 3.5, h = w * 0.45;
      wrap(x, y, w + 2, (X, Y) => {
        ell(g, X, Y, w, h, 'rgba(30,18,10,0.75)');
        g.beginPath(); g.ellipse(X, Y, w, h, 0, Math.PI * 1.1, Math.PI * 1.9); g.strokeStyle = 'rgba(170,205,225,0.45)'; g.lineWidth = 0.6; g.stroke();
        ell(g, X - w * 0.35, Y - h * 0.2, w * 0.25, h * 0.25, 'rgba(220,240,255,0.35)');
      });
    }
    for (let k = 0; k < 180; k++) { g.fillStyle = 'rgba(255,255,255,' + (0.18 + r() * 0.3).toFixed(2) + ')'; g.fillRect(r() * N, r() * N, 0.5, 0.5); }
  }
  return c;
}
function soilPattern(g, wet) {
  const k = wet ? 'w' : 'd';
  if (!SOIL_CV[k]) SOIL_CV[k] = soilCanvas(wet);
  const pat = g.createPattern(SOIL_CV[k], 'repeat');
  try { if (pat.setTransform && window.DOMMatrix) pat.setTransform(new DOMMatrix().scale(0.5)); } catch (e) { }
  return pat;
}

<script>/* js/world.js */
// Meeple Meadows — world state, map generation, simulation, saving.
'use strict';

const MW = 64, MH = 48;            // map size in tiles
const CX = 32, CY = 24;            // homestead centre
const DAY_LEN = 960;               // seconds per visual day
const COVER = { NONE: 0, BRUSH: 1, TREE: 2, BIG: 3, ROCK: 4, WATER: 5 };
const FLOOR = { GRASS: 0, PATH: 1, PLOT: 2 };
const COVER_COST = [0, 4, 15, 45, 70, 0];
const COVER_NAME = ['', 'Brambles', 'Tree', 'Old Tree', 'Boulder', 'Pond'];

let S = null;            // current game state
let OCC = null;          // Int32Array tile -> building id (runtime)
let BMAP = {};           // building id -> building
let GHMAP = null;        // Int32Array tile -> greenhouse id (runtime)
const EV = [];           // events for renderer/ui: {t:'pop', ...}
function emit(e) { EV.push(e); }

const idx = (x, y) => y * MW + x;
const inMap = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;

// ---------------------------------------------------------------- new game
function newGame(slot) {
  const seed = (Math.random() * 1e9) | 0;
  S = {
    v: 2, slot, seed, created: Date.now(), playTime: 0, day: 0.32, lastSeason: 1, weather: { rain: 0, next: 300 }, fishXP: 0,
    coins: 20, level: 0, won: false, fairSeen: false,
    lifetime: {}, inv: {}, auto: {}, upg: {},
    cover: new Uint8Array(MW * MH), floor: new Uint8Array(MW * MH),
    plots: {}, buildings: [], meeples: [], nextId: 1,
    stats: { sold: 0, earned: 0, cleared: 0, made: 0, crafted: 0 },
    built: {}, // type -> count ever bought (for cost scaling)
    tutorial: 0,
  };
  genMap(seed);
  // starting layout
  for (let y = CY - 1; y <= CY + 1; y++) for (let x = CX - 4; x <= CX - 2; x++) makePlot(idx(x, y), 'carrot', true);
  addBuilding('storehouse', CX + 1, CY - 3, true);
  addBuilding('market', CX + 1, CY + 1, true);
  for (let y = CY - 2; y <= CY + 2; y++) S.floor[idx(CX, y)] = FLOOR.PATH;
  S.floor[idx(CX - 1, CY)] = FLOOR.PATH;
  rebuildOcc();
  const m = makeMeeple('founder', CX * T + T / 2, CY * T + T / 2);
  m.name = 'Pip';
  S.meeples.push(m);
  initExtras(S); recalcJB();
  return S;
}

function genMap(seed) {
  const rnd = mulberry(seed);
  const ponds = [];
  ponds.push([CX - 9 + rnd() * 2, CY + 5 + rnd() * 2, 2.1 + rnd() * 0.6]);
  for (let i = 0; i < 5; i++) {
    const a = rnd() * Math.PI * 2, d = 12 + rnd() * 14;
    ponds.push([CX + Math.cos(a) * d * 1.3, CY + Math.sin(a) * d * 0.9, 1.4 + rnd() * 2]);
  }
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const i = idx(x, y), dx = x - CX + 0.5, dy = y - CY;
    const warp = (fbm(x * 0.18, y * 0.18, seed) - 0.5) * 3.2;
    const d = Math.sqrt((dx / 1.25) ** 2 + dy * dy) + warp;
    let c = COVER.NONE;
    if (d < 5.6) c = COVER.NONE;
    else if (d < 8.2) c = hash2(x, y, seed + 1) < 0.78 ? COVER.BRUSH : (hash2(x, y, seed + 2) < 0.5 ? COVER.TREE : COVER.NONE);
    else {
      const rockN = fbm(x * 0.22 + 50, y * 0.22, seed + 9);
      const bigP = Math.min(0.55, (d - 8) / 40);
      const h = hash2(x, y, seed + 3);
      if (rockN > 0.66 && h < 0.6) c = COVER.ROCK;
      else if (h < 0.12) c = COVER.BRUSH;
      else if (h < 0.12 + bigP) c = COVER.BIG;
      else c = COVER.TREE;
    }
    for (const [px, py, pr] of ponds) {
      const pd = Math.hypot((x + 0.5 - px) / 1.2, y + 0.5 - py) + (fbm(x * 0.5, y * 0.5, seed + 4) - 0.5) * 1.2;
      if (pd < pr && Math.hypot(x - CX, y - CY) > 4.5) c = COVER.WATER;
    }
    S.cover[i] = c;
  }
}

// ---------------------------------------------------------------- entities
function makePlot(i, crop, planted, gh) {
  S.floor[i] = FLOOR.PLOT;
  S.plots[i] = { crop, t: 0, st: planted ? 1 : 0, gen: 0, claim: 0, wclaim: 0, wet: false, bonus: 1, plan: {} };
  if (gh) S.plots[i].gh = gh;
}

// ---------------------------------------------------------------- seasons
// Seasons were removed in v1.4 (waiting for a season to unlock a crop took too long).

    case 'scare': case 'pounce': for (let k = 0; k < 5; k++) addPart({ type: 'poof', x: e.x + (Math.random() - 0.5) * 16, y: e.y - 4, max: 0.6, size: 7 }); break;
    case 'caught': { const b = BMAP[e.b]; if (b) for (let k = 0; k < 6; k++) addPart({ type: 'spark', x: (b.x + 0.5) * T + (Math.random() - 0.5) * 20, y: (b.y + 1) * T - 60 - Math.random() * 40, max: 0.9, size: 4 }); break; }
    case 'mend': { const { x, y } = tileC(e.i); for (let k = 0; k < 6; k++) addPart({ type: 'spark', x: x + (Math.random() - 0.5) * 24, y: y - 10 - Math.random() * 14, max: 0.8, size: 4 }); break; }
    case 'treegrown': { const b = BMAP[e.b]; if (b) for (let k = 0; k < 10; k++) addPart({ type: 'spark', x: (b.x + 0.5) * T + (Math.random() - 0.5) * 50, y: b.y * T - 30 - Math.random() * 50, max: 1.1, size: 5 }); AUDIO.sfx('ding'); break; }
    case 'spent': { const { x, y } = tileC(e.i); for (let k = 0; k < 6 * pq; k++) addPart({ type: 'chip', x, y, vx: (Math.random() - 0.5) * 60, vy: -30 - Math.random() * 30, g: 200, max: 0.6, col: '#a8884a', size: 2 }); break; }
    case 'plant': { const { x, y } = tileC(e.i); for (let k = 0; k < 5 * pq; k++) addPart({ type: 'chip', x, y, vx: (Math.random() - 0.5) * 50, vy: -30 - Math.random() * 30, g: 200, max: 0.5, col: '#7a5232', size: 1.8 }); break; }
    case 'water': { const { x, y } = tileC(e.i); for (let k = 0; k < 12 * pq + 3; k++) addPart({ type: 'drop', x: x + (Math.random() - 0.5) * 30, y: y - 18 - Math.random() * 6, vx: (Math.random() - 0.5) * 30, vy: 10 + Math.random() * 20, g: 300, max: 0.45, size: 1.4 }); AUDIO.sfx('water'); break; }
    case 'fill': for (let k = 0; k < 8 * pq + 2; k++) addPart({ type: 'drop', x: e.x + (Math.random() - 0.5) * 10, y: e.y - 20, vx: (Math.random() - 0.5) * 60, vy: -60 - Math.random() * 40, g: 300, max: 0.6, size: 1.6 }); AUDIO.sfx('splash'); break;
    case 'ripe': { const { x, y } = tileC(e.i); if (Math.random() < pq) addPart({ type: 'spark', x: x + (Math.random() - 0.5) * 20, y: y - 14, max: 0.8, size: 5 }); break; }
    case 'deposit': AUDIO.sfx('drop'); break;
    case 'crafted': { const b = BMAP[e.b]; if (b) { const d = BUILDINGS[b.type]; for (let k = 0; k < 10; k++) addPart({ type: 'spark', x: (b.x + d.w / 2) * T + (Math.random() - 0.5) * 40, y: b.y * T - Math.random() * 40, max: 1, size: 5 }); } AUDIO.sfx('ding'); break; }
    case 'meeple': { const m = e.m; for (let k = 0; k < 18; k++) addPart({ type: 'spark', x: m.x + (Math.random() - 0.5) * 40, y: m.y - 10 - Math.random() * 30, max: 1.2, size: 6 }); for (let k = 0; k < 6; k++) addPart({ type: 'poof', x: m.x, y: m.y - 8, max: 0.7, size: 14 }); AUDIO.sfx('meeple'); break; }
    case 'sold': AUDIO.sfx('coin'); break;
    case 'season': R.season = e.sea; R.restyleAll(); break;
  }
};

// ---------------------------------------------------------------- drawing
function sunInfo() {
  if (!R.dayNight) return { night: 0, dusk: 0 };
  const sun = Math.sin((S.day - 0.25) * Math.PI * 2);
  return { night: Math.min(1, Math.max(0, (0.12 - sun) / 0.5)), dusk: Math.exp(-Math.pow(sun / 0.22, 2)), sun };
}
const ghOpen = b => !!R.sel && ((R.sel.kind === 'b' && R.sel.id === b.id) || (R.sel.kind === 'plot' && S.plots[R.sel.id] && S.plots[R.sel.id].gh === b.id));

R.draw = function (dt) {
  const ctx = R.ctx, cam = R.cam, z = cam.z, pr = R.pr;
  R.time += dt;
  const t = R.time;
  if (R.season !== seasonIdx()) { R.season = seasonIdx(); R.restyleAll(); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = R.season === 3 ? '#6a7a80' : '#284a2a'; ctx.fillRect(0, 0, R.cv.width, R.cv.height);
  const k = z * pr;
  ctx.setTransform(k, 0, 0, k, (R.W / 2 - cam.x * z) * pr, (R.H / 2 - cam.y * z) * pr);
  const vw = R.W / z, vh = R.H / z;
  const x0 = cam.x - vw / 2, y0 = cam.y - vh / 2, x1 = x0 + vw, y1 = y0 + vh;

  // ground + cached deep forest. Missing chunks render a few per frame (smooth season changes).
  R._budget = R.q.budget;
  const size = CHUNK * T, ncx = Math.ceil(MW / CHUNK) - 1, ncy = Math.ceil(MH / CHUNK) - 1;
  const cy0 = Math.max(0, Math.floor(y0 / size)), cy1 = Math.min(ncy, Math.floor((y1 + FMT) / size));
  const cx0 = Math.max(0, Math.floor((x0 - FMX) / size)), cx1 = Math.min(ncx, Math.floor((x1 + FMX) / size));
  const vis = [];
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    const c = chunkAt(cx, cy, R._budget > 0 || !R.chunks[cx + ',' + cy] && R._budget > -6);
    vis.push([cx, cy, c]);
    if (c) ctx.drawImage(c.g, cx * size, cy * size, size + 0.5, size + 0.5);
    else { ctx.fillStyle = GPAL[R.season].B; ctx.fillRect(cx * size, cy * size, size, size); }
  }

  const tx0 = Math.max(0, Math.floor(x0 / T) - 2), ty0 = Math.max(0, Math.floor(y0 / T) - 1);
  const tx1 = Math.min(MW - 1, Math.ceil(x1 / T) + 2), ty1 = Math.min(MH - 1, Math.ceil(y1 / T) + 3);

  // water shimmer
  if (R.season !== 3) {
    ctx.lineCap = 'round'; ctx.lineWidth = 1.4;
    for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
      if (S.cover[idx(x, y)] !== COVER.WATER) continue;
      const a = (Math.sin(t * 0.8 + hash2(x, y, 1) * 6) + 1) / 2;
      ctx.strokeStyle = rgba('#e8fbff', 0.35 * a);
      const wx = x * T + 10 + hash2(x, y, 2) * 24, wy = y * T + 12 + hash2(x, y, 3) * 24;
      ctx.beginPath(); ctx.moveTo(wx - 6 - a * 3, wy); ctx.quadraticCurveTo(wx, wy - 2, wx + 6 + a * 3, wy); ctx.stroke();
    }
  }
  // watered soil: dark, glossy earth fades in over the dry texture (and back out as it dries)
  if (!R.wetPat) R.wetPat = soilPattern(ctx, true);
  const WA = R.wetA, fade = Math.min(1, dt * 2.5);
  for (const key in S.plots) {
    const p = S.plots[key], i = +key, X = i % MW, Y = (i / MW) | 0;
    const want = p.gh ? 1 : p.wet ? 0.62 + 0.13 * Math.min(3, +p.wet) : 0;
    const a = WA[key] == null ? want : WA[key] + (want - WA[key]) * fade; WA[key] = a;
    if (a < 0.02 || X * T < x0 - T || X * T > x1 || Y * T < y0 - T || Y * T > y1) continue;
    const sr = soilRect(X, Y);
    ctx.globalAlpha = a; ctx.fillStyle = R.wetPat; ctx.fillRect(sr.x, sr.y, sr.x1 - sr.x, sr.y1 - sr.y);
    ctx.fillStyle = 'rgba(20,10,4,0.3)';
    if (!sr.U) ctx.fillRect(sr.x, sr.y, sr.x1 - sr.x, 3);
    if (!sr.L) ctx.fillRect(sr.x, sr.y, 3, sr.y1 - sr.y);
  }
  ctx.globalAlpha = 1;

  if (R.clearMode) drawClearHints(ctx, tx0, ty0, tx1, ty1);
  if (R.paintCrop) drawPaintHints(ctx, x0, y0, x1, y1);
  if (R.sel && R.sel.kind === 'plot') { const px = (R.sel.id % MW) * T, py = ((R.sel.id / MW) | 0) * T; selRing(ctx, px + T / 2, py + T / 2, T * 0.62, T * 0.5); }
  if (R.sel && R.sel.kind === 'b' && BMAP[R.sel.id]) { const b = BMAP[R.sel.id], d = BUILDINGS[b.type]; selRing(ctx, (b.x + d.w / 2) * T, (b.y + d.h / 2) * T, d.w * T * 0.62, d.h * T * 0.5); }

  // deep forest layer
  for (const [cx, cy, c] of vis) if (c && c.f) ctx.drawImage(c.f, cx * size - FMX, cy * size - FMT, size + FMX * 2, size + FMT);

  // dynamic drawables, depth sorted
  const list = [];
  for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
    const i = idx(x, y), c = S.cover[i];
    if (c && c !== COVER.WATER) { if (!isDeep(x, y)) list.push({ y: y * T + T * 0.8, k: 0, i }); }
    else if (S.floor[i] === FLOOR.PLOT) list.push({ y: y * T + T * 0.55, k: 1, i });
  }
  for (const b of S.buildings) {
    const d = BUILDINGS[b.type];
    if ((b.x + d.w) * T < x0 - T || b.x * T > x1 + T || (b.y + d.h) * T < y0 - T || b.y * T > y1 + 160) continue;
    list.push({ y: (b.y + d.h) * T - 2, k: 2, b });
  }
  for (const m of S.meeples) if (m.x > x0 - T && m.x < x1 + T && m.y > y0 - T && m.y < y1 + T * 2) list.push({ y: m.y + 6, k: 3, m });
  for (const p of PESTS) if (p.x > x0 - T && p.x < x1 + T && p.y > y0 - T && p.y < y1 + T * 2) list.push({ y: p.y + 4, k: 4, p });
  for (const b of S.buildings) { const g = GUARD[b.id]; if (g && g.st !== 'home' && HUNTERS[b.type].kind !== 'owl') list.push({ y: g.y + 4, k: 5, b, g }); }
  list.sort((a, b) => a.y - b.y);

  const wind = Math.sin(t * 0.6) * 0.5 + Math.sin(t * 1.7) * 0.2;
  const sway = R.q.sway && z > 0.7;
  for (const o of list) {
    if (o.k === 0) drawCover(ctx, o.i, t, wind, sway);
    else if (o.k === 1) drawPlot(ctx, o.i, t, wind, sway);
    else if (o.k === 2) drawBuilding(ctx, o.b, t, dt);
    else if (o.k === 3) drawMeeple(ctx, o.m, t);
    else if (o.k === 4) drawPest(ctx, o.p, t);
    else drawHunter(ctx, o.b, o.g, t);
  }

  drawFishingLines(ctx);
  for (const b of S.buildings) { const g = GUARD[b.id]; if (g && g.st !== 'home' && HUNTERS[b.type].kind === 'owl') drawHunter(ctx, b, g, t); }
  drawBees(ctx, t, x0, y0, x1, y1);
  drawParticles(ctx, dt);
  drawAmbient(ctx, dt, x0, y0, x1, y1);
  for (const b of S.buildings) if (BUILDINGS[b.type].proc || b.type === 'creator') drawStatus(ctx, b, t);
  if (R.ghost) drawGhost(ctx);

  // lighting & weather (screen space)
  const sun = sunInfo();
  if (R.q.clouds) drawClouds(ctx, x0, y0, x1, y1, t, sun);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const raining = S.weather && S.weather.rain > 0;
  if (raining) { ctx.fillStyle = 'rgba(40,60,90,0.16)'; ctx.fillRect(0, 0, R.cv.width, R.cv.height); }
  if (sun.dusk > 0.02) { ctx.fillStyle = `rgba(255,140,70,${0.13 * sun.dusk})`; ctx.fillRect(0, 0, R.cv.width, R.cv.height); }
  if (sun.night > 0.01) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = mix('#ffffff', '#3a4a8f', sun.night * 0.72);
    ctx.fillRect(0, 0, R.cv.width, R.cv.height);
    ctx.globalCompositeOperation = 'source-over';
    if (R.q.lights) drawLights(ctx, sun.night, t);
  }
  drawWeather(ctx, dt, raining);
  ctx.drawImage(R.vg, 0, 0);
};

function selRing(ctx, x, y, rx, ry) {
  ctx.save();
  ctx.setLineDash([6, 5]); ctx.lineDashOffset = -R.time * 20;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,248,220,0.95)'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
}
// planting mode: dashed outline on every plot, a check on plots already growing the chosen crop
function drawPaintHints(ctx, x0, y0, x1, y1) {
  ctx.save(); ctx.setLineDash([5, 4]); ctx.lineDashOffset = -R.time * 12; ctx.lineWidth = 2;
  for (const key in S.plots) {
    const i = +key, px = (i % MW) * T, py = ((i / MW) | 0) * T;
    if (px < x0 - T || px > x1 || py < y0 - T || py > y1) continue;
    const same = S.plots[key].crop === R.paintCrop;
    rrect(ctx, px + 3, py + 3, T - 6, T - 6, 6); ctx.strokeStyle = same ? 'rgba(160,240,120,0.95)' : 'rgba(255,248,220,0.85)'; ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const key in S.plots) {
    if (S.plots[key].crop !== R.paintCrop) continue;
    const i = +key, px = (i % MW) * T, py = ((i / MW) | 0) * T;
    if (px < x0 - T || px > x1 || py < y0 - T || py > y1) continue;
    ctx.beginPath(); ctx.arc(px + T - 9, py + 9, 6.5, 0, Math.PI * 2); ctx.fillStyle = '#5aa335'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px + T - 12, py + 9); ctx.lineTo(px + T - 9.5, py + 11.5); ctx.lineTo(px + T - 5.5, py + 6.5); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.stroke();
  }
  ctx.restore();
}
function drawClearHints(ctx, tx0, ty0, tx1, ty1) {
  ctx.save();
  for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
    const i = idx(x, y); if (!canClear(i)) continue;
    const ok = S.coins >= clearCost(i), px = x * T + T / 2, py = y * T + T / 2;
    ctx.beginPath(); ctx.ellipse(px, py + 6, 20, 13, 0, 0, Math.PI * 2);
    ctx.fillStyle = ok ? 'rgba(255,240,170,0.35)' : 'rgba(200,60,40,0.25)'; ctx.fill();
    ctx.setLineDash([4, 3]); ctx.strokeStyle = ok ? 'rgba(255,250,220,0.9)' : 'rgba(255,180,160,0.7)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
}
function drawCoverLabels(ctx, tx0, ty0, tx1, ty1) {
  ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
    const i = idx(x, y); if (!canClear(i)) continue;
    const c = clearCost(i), ok = S.coins >= c, px = x * T + T / 2, py = y * T + T * 0.8;
    const s = fmt(c), w = ctx.measureText(s).width + 16;
    rrect(ctx, px - w / 2, py - 8, w, 16, 8); ctx.fillStyle = ok ? 'rgba(255,248,225,0.95)' : 'rgba(80,40,30,0.85)'; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.stroke();
    drawSprite(ctx, ART.icons.ui_coin, px - w / 2 + 2, py - 6, 0.38);
    ctx.fillStyle = ok ? '#4a3020' : '#ffd0c0'; ctx.fillText(s, px + 4, py + 0.5);
  }
}
function drawCover(ctx, i, t, wind, sway) {
  const p = coverPos(i), s = treeSprite(p.kind, p.v, R.season);
  ell(ctx, p.x + 4, p.y - 2, (p.kind === 'bush' || p.kind === 'rock' ? 20 : 24) * p.big, 8 * p.big, 'rgba(20,40,15,0.28)');
  if (sway && p.kind !== 'rock') {
    const sw = (wind + Math.sin(t * 1.3 + i * 0.7) * 0.25) * (p.kind === 'bush' ? 0.03 : 0.045);
    ctx.save(); ctx.translate(p.x, p.y); ctx.transform(1, 0, sw, 1, 0, 0); drawSprite(ctx, s, 0, 0, p.big); ctx.restore();
  } else drawSprite(ctx, s, p.x, p.y, p.big);
}
function drawPlot(ctx, i, t, wind, sway) {
  const p = S.plots[i]; if (!p) return;
  const x = (i % MW) * T + T / 2, y = ((i / MW) | 0) * T + T / 2;
  const live = plotInSeason(p);
  if (p.st === 0) { ctx.globalAlpha = live ? 0.75 : 0.35; drawSprite(ctx, ART.icons[p.crop], x - 8, y - 8, 0.5); ctx.globalAlpha = 1; return; }
  const f = p.t / growTarget(p);
  // a living plant regrowing its next harvest stays full-sized rather than restarting as a seedling
  const stage = p.st >= 2 ? 3 : (p.gen | 0) > 0 ? 2 : (f < 0.15 ? 0 : f < 0.35 ? 1 : 2);
  const s = plantSprite(p.crop, stage);
  if (!live) ctx.globalAlpha = 0.55;
  if (p.dmg) ctx.globalAlpha = 0.6;
  if (sway && live && stage >= 2) {
    const sw = (wind * 0.06 + Math.sin(t * 2 + i) * 0.02);
    ctx.save(); ctx.translate(x, y + 18); ctx.transform(1, 0, sw, 1, 0, 0); drawSprite(ctx, s, 0, -18); ctx.restore();
  } else drawSprite(ctx, s, x, y);
  ctx.globalAlpha = 1;
  if (!live) { // dormant until its season comes back
    ctx.beginPath(); ctx.arc(x + 13, y - 13, 7, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,250,235,0.92)'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.fillStyle = '#6a4a32'; ctx.fillRect(x + 10, y - 16.5, 2, 7); ctx.fillRect(x + 14, y - 16.5, 2, 7);
  } else if (p.dmg) {
    // chewed: crumbs on the soil and a little nibbled-leaf sign
    [[-8, 12], [6, 14], [11, 6], [-3, 16]].forEach(([dx, dy]) => ell(ctx, x + dx, y + dy, 1.4, 0.9, '#c8b088'));
    ctx.beginPath(); ctx.arc(x + 13, y - 13, 7, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,240,225,0.95)'; ctx.fill(); ctx.strokeStyle = '#c8602a'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(x + 13, y - 13, 6, 0, Math.PI * 2); ctx.clip();
    leaf(ctx, x + 9, y - 10, -0.8, 8, 3.2, '#5aa335'); ell(ctx, x + 15.5, y - 15.5, 2.4, 2.4, 'rgba(255,240,225,1)'); ell(ctx, x + 13, y - 18, 1.8, 1.8, 'rgba(255,240,225,1)'); ctx.restore();
  } else if (p.st === 2) {
    ctx.globalAlpha = 0.6 * (0.5 + 0.5 * Math.sin(t * 4 + i)); drawSprite(ctx, ART.icons.ui_star, x + 10, y - 26, 0.28); ctx.globalAlpha = 1;
  }
}
function drawBuilding(ctx, b, t, dt) {
  const d = BUILDINGS[b.type];
  const bx = (b.x + d.w / 2) * T, by = (b.y + d.h) * T;
  if (b.type === 'greenhouse') { drawSprite(ctx, greenhouseSprite(ghOpen(b)), bx, by); return; }
  if (b.type === 'dock') drawPier(ctx, b);
  if (BUILDINGS[b.type].tree) { drawOrchardTree(ctx, b, bx, by, t); return; }
  const s = buildingSprite(b.type);
  const working = b.phase === 'work' || (b.type === 'creator' && b.queue.length);
  ell(ctx, bx + 3, by - d.h * T * 0.4, d.w * T * 0.5, d.h * T * 0.3, 'rgba(20,40,15,0.24)');
  drawSprite(ctx, s, bx, by);
  const pq = R.q.parts;
  switch (b.type) {
    case 'mill': b._rot = (b._rot || 0) + (working ? 2.6 : 0.35) * dt; drawSails(ctx, bx, by - 86, b._rot); break;
    case 'pot':
      flame(ctx, bx, by - 30, t, working ? 1.2 : 0.55);
      if (working) {
        const col = (GOOD[RECIPE[b.recipe].out[0]].icon.c) || '#c8a050';
        ctx.beginPath(); ctx.ellipse(bx, by - 60, 25, 6, 0, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
        for (let k = 0; k < 4; k++) { const ph = (t * 1.5 + k * 0.6) % 1; ell(ctx, bx - 14 + k * 9, by - 60, 2 + ph * 2.5, 1 + ph, rgba(shade(col, 0.4), 1 - ph)); }
        if (Math.random() < 0.08 * pq) addPart({ type: 'steam', x: bx + (Math.random() - 0.5) * 30, y: by - 66, vy: -18, vx: (Math.random() - 0.5) * 6, max: 2, size: 6 });
      }
      break;
    case 'kettle':
      flame(ctx, bx - 8, by - 12, t, working ? 0.8 : 0.3);
      if (Math.random() < 0.03 * pq) addPart({ type: 'smoke', x: bx + 9, y: by - 94, vy: -16, vx: 5, max: 3, size: 6 });
      if (working && Math.random() < 0.08 * pq) addPart({ type: 'steam', x: bx - 10 + (Math.random() - 0.5) * 16, y: by - 74, vy: -16, max: 1.6, size: 5 });
      break;
    case 'oven':
      flame(ctx, bx - 5, by - 12, t, working ? 0.9 : 0.35);
      if (Math.random() < (working ? 0.06 : 0.02) * pq) addPart({ type: 'smoke', x: bx + 12, y: by - 88, vy: -16, vx: 4, max: 3, size: 6 });
      break;
    case 'teahouse':
      if (working && Math.random() < 0.06 * pq) addPart({ type: 'steam', x: bx + (Math.random() - 0.5) * 8, y: by - 112, vy: -14, max: 1.6, size: 4 });
      break;
    case 'still':
      flame(ctx, bx - 18, by - 12, t, working ? 0.8 : 0.25);

function openFishingGame() {
  if (!fishers().length) { toast('Assign a Meeple to Fish first (Meeples → 🎣)', true); return; }
  const fish = FISHMAP[rollFish()], rIdx = ['common', 'uncommon', 'rare', 'epic', 'legendary'].indexOf(fish.rar), lv = fishLevel();
  const st = { hits: 0, miss: 0, need: 3, zone: Math.max(0.1, Math.min(0.42, 0.3 - rIdx * 0.045 + lv * 0.007)), zc: 0.5, speed: 0.55 + rIdx * 0.22, t: 0, done: false, flash: 0, fc: '' };
  const hint = ['A little nibble…', 'Something tugging…', 'A strong pull!', 'Something BIG!', 'The water is glowing…!'][rIdx];
  const m = modal(`<h2>🎣 Gone Fishing</h2><p class="p" id="fgMsg">${hint} Tap <b>Reel!</b> when the bobber is in the green.</p>
    <canvas id="fgCv" width="640" height="150" style="width:100%;max-width:34rem;border:2px solid var(--ink);border-radius:.8rem;display:block;margin:.4rem auto"></canvas>
    <div class="row" style="justify-content:center;gap:1rem"><span class="s" id="fgScore"></span></div>
    <div class="btns" id="fgBtns"><button class="btn gold" data-a="reel" style="font-size:1.4rem;padding:.8rem 2.4rem">Reel!</button><button class="btn" data-a="leave">Leave</button></div>`,
    a => {
      if (a === 'leave') { st.done = true; closeModal(); }
      else if (a === 'again') { st.done = true; openFishingGame(); }
      else if (a === 'reel' && !st.done) {
        const pos = (Math.sin(st.t * st.speed * Math.PI * 2) + 1) / 2;
        if (Math.abs(pos - st.zc) <= st.zone / 2) { st.hits++; st.flash = 1; st.fc = '#7ad050'; AUDIO.sfx('pop'); st.zc = 0.15 + Math.random() * 0.7; }
        else { st.miss++; st.flash = 1; st.fc = '#e8463a'; AUDIO.sfx('error'); }
        if (st.hits >= st.need) finish(true); else if (st.miss >= 2) finish(false);
      }
    });
  const cv = document.getElementById('fgCv'), g = cv.getContext('2d');
  function finish(won) {
    st.done = true;
    const msg = document.getElementById('fgMsg'), btns = document.getElementById('fgBtns');
    if (won) {
      invAdd(fish.id, 1); addFishXP(fish.xp * 2); AUDIO.sfx('meeple');
      msg.innerHTML = `<span class="burst" style="display:inline-block">${iconImg(fish.id, 'xl')}</span><br>You caught a <b>${fish.name}</b>! <span style="color:${RARITY[fish.rar].col};font-weight:900">${RARITY[fish.rar].name}</span> · +${fish.xp * 2} XP`;
    } else { addFishXP(1); msg.innerHTML = `It got away! <span class="s">(+1 XP)</span>`; }
    btns.innerHTML = `<button class="btn green" data-a="again">Cast again</button><button class="btn" data-a="leave">Done</button>`;
  }
  let last = performance.now();
  (function loop(now) {
    if (!document.getElementById('fgCv')) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!st.done) st.t += dt;
    if (rIdx >= 3 && !st.done) st.zc = Math.max(st.zone / 2, Math.min(1 - st.zone / 2, st.zc + Math.sin(st.t * 1.3) * dt * 0.12));
    const W = cv.width, H = cv.height, x0 = 30, x1 = W - 30, bw = x1 - x0;
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#6ab8d8'); gr.addColorStop(1, '#2a6a9a');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 2;
    for (let i = 0; i < 6; i++) { const y = 20 + i * 22, o = (st.t * 30 + i * 50) % 80; g.beginPath(); g.moveTo(o, y); g.quadraticCurveTo(o + 20, y - 4, o + 40, y); g.stroke(); }
    g.fillStyle = 'rgba(0,30,50,0.35)'; g.fillRect(x0, 62, bw, 26);
    g.fillStyle = 'rgba(120,230,100,0.85)'; g.fillRect(x0 + (st.zc - st.zone / 2) * bw, 62, st.zone * bw, 26);
    g.strokeStyle = '#3d2a1f'; g.lineWidth = 2; g.strokeRect(x0, 62, bw, 26);
    const pos = (Math.sin(st.t * st.speed * Math.PI * 2) + 1) / 2, bx = x0 + pos * bw;
    g.beginPath(); g.moveTo(bx, 0); g.lineTo(bx, 60); g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 1.5; g.stroke();
    g.beginPath(); g.arc(bx, 75, 13, 0, Math.PI * 2); g.fillStyle = '#e8463a'; g.fill(); g.lineWidth = 2; g.strokeStyle = '#3d2a1f'; g.stroke();
    g.fillStyle = '#fbf8f0'; g.fillRect(bx - 13, 73, 26, 5);
    // the fish shadow lurking below
    g.globalAlpha = 0.35; g.fillStyle = '#0a1a2a'; g.beginPath(); g.ellipse(W / 2 + Math.sin(st.t * 0.7) * 120, 122, 26 + rIdx * 8, 9 + rIdx * 2, 0, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
    if (st.flash > 0) { g.globalAlpha = st.flash * 0.35; g.fillStyle = st.fc; g.fillRect(0, 0, W, H); g.globalAlpha = 1; st.flash -= dt * 3; }
    const sc = document.getElementById('fgScore');
    if (sc) sc.innerHTML = `Reeled ${'🟢'.repeat(st.hits)}${'⚪'.repeat(st.need - st.hits)} &nbsp; Slips ${'❌'.repeat(st.miss)}${'·'.repeat(2 - st.miss)}`;
    requestAnimationFrame(loop);
  })(last);
}

// ---------------------------------------------------------------- world taps
function tileAt(wx, wy) { const x = Math.floor(wx / T), y = Math.floor(wy / T); return inMap(x, y) ? { x, y, i: idx(x, y) } : null; }
function onWorldTap(sx, sy) {
  hidePop();
  const w = R.screenToWorld(sx, sy), t = tileAt(w.x, w.y);
  if (!t) return;
  if (UI.mode === 'paint') { if (!paintPlot(t.i)) toast('Tap a garden plot to plant ' + CROP[UI.paintCrop].name, true); return; }
  if (UI.mode === 'place') {
    const type = UI.placeType, d = BUILDINGS[type];
    const x = t.x - Math.floor((d.w - 1) / 2), y = t.y - Math.floor((d.h - 1) / 2);
    if (S.coins < bCost(type)) { toast('Not enough coins', true); return; }
    if (d.max && bCount(type) >= d.max) { toast('You have the maximum number of these', true); setMode(null); return; }
    if (d.found && !(S.found[type] > 0)) { toast('None left to place', true); setMode(null); return; }
    if (d.tree && !(S.inv[TREE_OF[type].seed] > 0)) { toast('No ' + ITEM[TREE_OF[type].seed].name.toLowerCase() + 's left. Buy more at Market → Seeds', true); setMode(null); return; }
    if (type === 'duckhouse' && dockWater({ x, y }) < 0) { toast('A Duck House has to touch a pond', true); return; }
    if (!canPlace(type, x, y)) { toast(type === 'plot' || type === 'path' ? 'That spot needs clear, empty ground' : 'Needs clear ground — and must not block paths', true); return; }
    place(type, x, y);
    const again = (type === 'plot' || type === 'path' || d.cat === 'decor' || type === 'barrel' || type === 'crock' || type === 'hive') && S.coins >= bCost(type) && !(d.max && bCount(type) >= d.max) && !(d.found && !(S.found[type] > 0)) && !(d.tree && !(S.inv[TREE_OF[type].seed] > 0)) || (d.tree && S.inv[TREE_OF[type].seed] > 0 && bCount(type) < d.max);
    if (!again) setMode(null);
    return;
  }
  if (UI.mode === 'move') {
    const b = UI.moving, d = BUILDINGS[b.type];
    const x = t.x - Math.floor((d.w - 1) / 2), y = t.y - Math.floor((d.h - 1) / 2);
    if (moveBuilding(b, x, y)) setMode(null); else toast('Needs clear ground — and must not block paths', true);
    return;
  }
  if (UI.mode === 'remove') { if (S.floor[t.i] && !OCC[t.i] && !ghOf(t.i)) { removeFloor(t.i); AUDIO.sfx('drop'); } return; }
  if (UI.mode === 'clear') {
    if (canClear(t.i)) { if (!doClear(t.i)) toast('Need ' + fmt(clearCost(t.i)) + ' coins', true, 'coin'); }
    else if (S.cover[t.i] && S.cover[t.i] !== COVER.WATER) toast('Clear the land next to it first', true);
    return;
  }
  // meeple?
  let best = null, bd = 22;
  for (const m of S.meeples) { const d = Math.hypot(m.x - w.x, m.y - 12 - w.y); if (d < bd) { bd = d; best = m; } }
  if (best) { openPanel('meeple', best.id); return; }
  // greenhouse: first tap lifts the roof, then plots inside can be tapped
  const gh = ghOf(t.i);
  if (gh) {
    const open = R.sel && ((R.sel.kind === 'b' && R.sel.id === gh.id) || (R.sel.kind === 'plot' && S.plots[R.sel.id] && S.plots[R.sel.id].gh === gh.id));
    if (open && S.plots[t.i]) openPanel('plot', t.i); else openPanel('greenhouse', gh.id);
    return;
  }
  // building? (also allow tapping the tall part just above the footprint)
  let bid = OCC[t.i];
  if (!bid) { const above = tileAt(w.x, w.y + T); if (above && OCC[above.i] && BUILDINGS[BMAP[OCC[above.i]].type].w > 1) bid = OCC[above.i]; }
  if (bid) {
    const b = BMAP[bid];
    if (b.type === 'creator') openPanel('creator', b.id);
    else if (b.type === 'dock') openPanel('dock', b.id);
    else if (b.type === 'noticeboard') openPanel('orders', b.id);
    else if (b.type === 'compost') openPanel('compost', b.id);
    else if (b.type === 'market') openPanel('market');
    else if (BUILDINGS[b.type].proc) openPanel('proc', b.id);
    else openPanel('bldg', b.id);
    return;
  }
  if (S.plots[t.i]) { openPanel('plot', t.i); return; }
  const c = S.cover[t.i];
  if (c && c !== COVER.WATER) {
    closePanel();
    if (!canClear(t.i)) { showPop(sx, sy, `<div class="t">${COVER_NAME[c]}</div><div class="s">Clear the land next to it first.</div>`, () => { }); return; }
    const cost = clearCost(t.i);
    showPop(sx, sy, `<div class="row"><div class="grow"><div class="t">${COVER_NAME[c]}</div>${costHtml(cost)}</div><button class="btn sm green ${S.coins < cost ? 'dis' : ''}" data-a="clr">${iconImg('axe', 'sm')} Clear</button></div>`,
      a => { if (a === 'clr') { if (doClear(t.i)) hidePop(); else toast('Not enough coins', true); } });
    return;
  }
  if (c === COVER.WATER) { showPop(sx, sy, `<div class="t">Lily Pond</div><div class="s">Frogs live here. Leave it be.</div>`, () => { }); return; }
  closePanel();
}
function onWorldHover(sx, sy) {
  if (UI.mode !== 'place' && UI.mode !== 'move') { R.ghost = null; return; }
  const w = R.screenToWorld(sx, sy), t = tileAt(w.x, w.y); if (!t) return;
  const type = UI.mode === 'place' ? UI.placeType : UI.moving.type, d = BUILDINGS[type];
  const x = t.x - Math.floor((d.w - 1) / 2), y = t.y - Math.floor((d.h - 1) / 2);

// ---------------------------------------------------------------- input (pan / pinch / tap)
const PTR = new Map();
let pinch = null, dragMoved = false, downAt = null, paintDrag = false;
function setupInput() {
  const cv = R.cv;
  cv.addEventListener('pointerdown', e => {
    AUDIO.unlock();
    try { cv.setPointerCapture(e.pointerId); } catch (err) { }
    PTR.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
    if (PTR.size === 1) {
      dragMoved = false; downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; onWorldHover(e.clientX, e.clientY);
      // in planting mode, a drag that starts on a plot plants along the way instead of panning
      const w = R.screenToWorld(e.clientX, e.clientY), t = tileAt(w.x, w.y);
      paintDrag = UI.mode === 'paint' && UI.inGame && !UI.paused && !!t && !!S.plots[t.i];
      if (paintDrag) { paintPlot(t.i); dragMoved = true; }
    }
    if (PTR.size === 2) { paintDrag = false; const [a, b] = [...PTR.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: R.cam.z, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 }; dragMoved = true; }
  });
  cv.addEventListener('pointermove', e => {
    const p = PTR.get(e.pointerId);
    if (!p) { onWorldHover(e.clientX, e.clientY); return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (PTR.size === 1) {
      if (paintDrag) { const w = R.screenToWorld(p.x, p.y), t = tileAt(w.x, w.y); if (t) paintPlot(t.i); return; }
      if (Math.hypot(p.x - p.sx, p.y - p.sy) > 9) dragMoved = true;
      if (dragMoved) { R.cam.x -= dx / R.cam.z; R.cam.y -= dy / R.cam.z; R.clampCam(); hidePop(); }
    } else if (PTR.size === 2 && pinch) {
      const [a, b] = [...PTR.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const before = R.screenToWorld(cx, cy);
      R.cam.z = pinch.z * d / pinch.d; R.clampCam();
      const after = R.screenToWorld(cx, cy);
      R.cam.x += before.x - after.x; R.cam.y += before.y - after.y;
      // pan with the pinch centre
      R.cam.x -= (cx - pinch.cx) / R.cam.z; R.cam.y -= (cy - pinch.cy) / R.cam.z; pinch.cx = cx; pinch.cy = cy;
      R.clampCam();
    }
  });
  const up = e => {
    const p = PTR.get(e.pointerId); if (!p) return;
    PTR.delete(e.pointerId);
    if (PTR.size < 2) pinch = null;
    if (PTR.size === 0 && !dragMoved && downAt && performance.now() - downAt.t < 600 && UI.inGame && !UI.paused) { worldTapAt = performance.now(); onWorldTap(e.clientX, e.clientY); }
    if (PTR.size === 0) { downAt = null; paintDrag = false; }
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', e => { PTR.delete(e.pointerId); pinch = null; downAt = null; });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const before = R.screenToWorld(e.clientX, e.clientY);
    R.cam.z *= Math.pow(1.0015, -e.deltaY * (e.ctrlKey ? 6 : 1)); R.clampCam();          // ctrl: a pinch on a trackpad
    const after = R.screenToWorld(e.clientX, e.clientY);
    R.cam.x += before.x - after.x; R.cam.y += before.y - after.y; R.clampCam();
  }, { passive: false });
  // Sound may only start from a finished tap, click or key press (iOS does not count the press itself).
  for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) document.addEventListener(ev, () => AUDIO.unlock(), { capture: true });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') handleBack(); });
}

function openPause() {

<script>/* js/ui2.js */
// Meeple Meadows — UI for the homestead extras: alerts, orders board, compost bin, journal & farm
// stats, hats, found decorations, "show me what's missing", Blue Ribbons and legacy meadows.
'use strict';

const LIVE_X = {
  ot: id => { const o = S.orders.find(x => x.id == id); return o ? fmtTime(o.t) + ' left' : ''; },
  cmp: () => compostCap() ? S.compost.mat / compostCap() : 0,
  cmpt: () => Math.floor(S.compost.mat) + ' / ' + compostCap() + ' scraps',
  fert: () => fmt(S.inv.fertilizer || 0),
  st: k => k === 'rate' ? fmt(earnRate(3600)) : k === 'avg' ? fmt(S.playTime > 60 ? S.stats.earned / S.playTime * 3600 : 0) : k === 'time' ? fmtTime(S.playTime) : '',
};

// ---------------------------------------------------------------- HUD alerts (orders, stuck buildings, decorations)
let _stuckIdx = 0;
function updateAlerts() {
  const el = $('hAlerts'); if (!el) return;
  const items = [];
  if (hasBoard()) {
    const ready = S.orders.filter(canFill).length;
    items.push(`<button class="pill alert ${ready ? 'good' : ''}" data-a="orders">${iconImg('orders')}<span>${ready ? ready + ' ready' : S.orders.length + ' order' + (S.orders.length === 1 ? '' : 's')}</span></button>`);
  }
  const stuck = stuckList().length;
  if (stuck) items.push(`<button class="pill alert bad" data-a="stuck">${iconImg('alert')}<span>${stuck} stuck</span></button>`);
  let found = 0; for (const k in S.found) found += S.found[k] || 0;
  if (found) items.push(`<button class="pill alert" data-a="found">${iconImg('star')}<span>${found} to place</span></button>`);
  const h = items.join('');
  if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; }
}
$('hAlerts') && ($('hAlerts').onclick = e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  AUDIO.sfx('click');
  const a = el.dataset.a;
  if (a === 'orders') { const b = S.buildings.find(x => x.type === 'noticeboard'); if (b) openPanel('orders', b.id); }
  else if (a === 'found') openPanel('build', null, 'decor');
  else if (a === 'stuck') {
    // each tap jumps to the next stuck building
    const list = stuckList(); if (!list.length) return;
    const b = list[_stuckIdx++ % list.length], d = BUILDINGS[b.type];

// ---------------------------------------------------------------- what's missing, and where it comes from
function sourceInfo(k) {
  if (CROP[k]) {
    if (!cropUnlocked(k)) return { text: 'A crop you haven\'t unlocked yet', btn: null };
    const n = Object.values(S.plots).filter(p => p.crop === k).length;
    return { text: n ? `Growing in ${n} plot${n > 1 ? 's' : ''}; plant more to keep up` : 'Grown in garden plots, but none are planted', btn: 'Plant it' };
  }
  if (FISHMAP[k]) return { text: S.buildings.some(b => b.type === 'dock') ? 'Caught by a Meeple on fishing duty at a dock' : 'Caught at a Fishing Dock (none built yet)', btn: 'Show me' };
  const r = RECIPES.find(x => x.out[0] === k);
  if (!r) return { text: '', btn: null };
  const where = BUILDINGS[r.at].name, have = S.buildings.filter(b => b.type === r.at);
  if (!have.length) return { text: `Made at a ${where} (not built yet)`, btn: bUnlocked(r.at) ? 'Build one' : null };
  const making = have.some(b => b.recipe === r.id && b.phase !== 'idle');
  return { text: making ? `A ${where} is making it now` : `Made at the ${where}; none are set to make it`, btn: making ? 'Show me' : 'Set it up' };
}
function missingHtml(b) {
  const miss = missingOf(b); if (!miss.length) return '';
  return `<div class="warnbox"><div class="t">${iconImg('alert', 'sm')} Waiting for ingredients</div>` + miss.map(k => {
    const s = sourceInfo(k);
    return `<div class="row" style="margin-top:.35rem">${iconImg(k)}<div class="grow"><b>${ITEM[k].name}</b><div class="s">${s.text}</div></div>${s.btn ? `<button class="btn sm gold" data-a="source" data-v="${k}">${s.btn}</button>` : ''}</div>`;
  }).join('') + '</div>';
}
function focusB(b) { const d = BUILDINGS[b.type]; R.cam.x = (b.x + d.w / 2) * T; R.cam.y = (b.y + d.h / 2) * T; R.clampCam(); }
function findSource(k) {
  if (CROP[k]) { setMode('paint', k); toast('Tap or drag across plots to plant ' + CROP[k].name, false, k); return; }
  if (FISHMAP[k]) {
    const d = S.buildings.find(b => b.type === 'dock');
    if (d) { focusB(d); openPanel('dock', d.id); } else openPanel('build', null, 'water');
    return;
  }
  const r = RECIPES.find(x => x.out[0] === k); if (!r) return;
  const have = S.buildings.filter(b => b.type === r.at);
  if (!have.length) { openPanel('build', null, BUILDINGS[r.at].cat); toast('Build a ' + BUILDINGS[r.at].name + ' to make ' + ITEM[k].name, false, 'hammer'); return; }
  const b = have.find(x => x.recipe === r.id && x.phase !== 'idle') || have.find(x => !x.recipe || x.phase === 'idle') || have[0];
  focusB(b); openPanel('proc', b.id);
  if (b.recipe !== r.id) toast('Tap Make on ' + ITEM[k].name + ' to start it here', false, k);
}
PANELS.proc.act = (a, v) => { if (a === 'source') { findSource(v); return 'stop'; } };

function foundCard(t) {
  const d = BUILDINGS[t], have = S.found[t] || 0, placed = bCount(t);

    <button class="btn sm green ${have ? '' : 'dis'}" data-a="build" data-v="${t}">Place</button></div></div></div></div>`;
}

// ---------------------------------------------------------------- orders board
PANELS.orders = {
